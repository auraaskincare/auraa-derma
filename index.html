<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Derma-Intelligence">

<title>Auraa · Derma-Intelligence</title>
<style>
:root{
  /* Auraa brand. Magenta and black on white, taken from the clinic logo.
     Near-white page so skin tone in photos is judged accurately. */
  --ground:#FAF7F9; --panel:#FFFFFF; --panelHi:#F7F2F5; --line:#E8E2E5;
  --rose:#E5007D;        /* Auraa magenta */
  --roseDeep:#C40065;    /* darker magenta, for small text */
  --gold:#8A6F14; --cream:#1A1A1A; --muted:#6B6266; --dim:#7C737A;
  --ok:#2F7D5F; --warn:#9C6410; --bad:#B3453F; --info:#3E6A97;
  --mono:'SF Mono','Roboto Mono',Menlo,ui-monospace,monospace;
  --display:'Iowan Old Style','Palatino Linotype',Georgia,serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ground);color:var(--cream);font-family:var(--body);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
.hide{display:none!important}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--roseDeep);text-transform:uppercase}
.eyebrow.dim{color:var(--dim)}
/* brand lockup, matching the clinic logo */
.wordmark{font-family:var(--display);color:var(--rose);letter-spacing:.20em;
  font-size:19px;line-height:1;font-weight:400}
.wordmark.big{font-size:40px;letter-spacing:.22em}
.services{font-family:var(--display);color:var(--cream);letter-spacing:.10em;
  font-size:9.5px;margin-top:7px;line-height:1}
.services.big{font-size:12px;margin-top:11px}
h2.disp{font-family:var(--display);font-size:24px;font-weight:400;margin:6px 0 4px}
.mono{font-family:var(--mono)}
.sub{color:var(--muted);font-size:13px;line-height:1.55}
.tiny{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .name{font-family:var(--display);font-size:17px}
header.top .spacer{flex:1}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;
  min-width:44px;height:36px;font-size:12px;padding:0 10px}
main{padding:16px 16px 24px;max-width:820px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:transparent;border:none;color:var(--dim);padding:10px 4px 12px;
  font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
nav.tabs button .g{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--rose)}
.btn{background:transparent;border:1px solid var(--rose);color:var(--cream);border-radius:6px;
  padding:12px 16px;font-size:14px;min-height:46px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;width:100%}
.btn.solid{background:var(--rose);color:#FFFFFF;font-weight:600;border-color:var(--rose)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{width:auto;padding:9px 14px;min-height:40px;font-size:13px}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{width:auto;flex:1;min-width:130px}
label.fld{display:block;margin-bottom:12px}
label.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input.in,select.in,textarea.in{width:100%;padding:12px;background:var(--panelHi);
  border:1px solid var(--line);color:var(--cream);border-radius:6px;min-height:46px}
textarea.in{min-height:76px;resize:vertical;line-height:1.5}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--rose)}
.chip{font-family:var(--mono);font-size:9px;padding:3px 7px;border-radius:3px;
  border:1px solid var(--line);color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.chip.ai{border-color:var(--info);color:var(--info)}
.chip.you{border-color:var(--gold);color:var(--gold)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:13px;margin-bottom:9px;
  box-shadow:0 1px 2px rgba(42,32,35,.05)}
.card.tap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--cream)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--line);color:var(--rose);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;flex-shrink:0}
.banner{padding:11px 13px;border-radius:6px;background:var(--panel);border-left:3px solid var(--warn);
  font-size:12.5px;line-height:1.55;margin-bottom:9px;color:var(--cream)}
.banner.bad{border-left-color:var(--bad)}
.banner.ok{border-left-color:var(--ok)}
.banner.info{border-left-color:var(--info)}
.metric{border-bottom:1px solid var(--line);padding:12px 0}
.metric:last-child{border-bottom:none}
.metric .mtop{display:flex;align-items:center;gap:8px;justify-content:space-between}
.metric .mname{font-size:14px}
.metric .mval{font-family:var(--mono);font-size:19px}
.metric .mval.locked{color:var(--info)}
.bar{height:5px;background:var(--panelHi);border-radius:3px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--info);border-radius:3px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:var(--panelHi)}
.thumbwrap{position:relative}
.thumbwrap button.del{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.94);border:1px solid var(--line);
  color:var(--bad);border-radius:4px;width:26px;height:26px;font-size:13px;line-height:1;padding:0;
  box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pill{padding:8px 13px;border-radius:20px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  background:transparent;border:1px solid var(--line);color:var(--muted);min-height:38px}
.pill.on{background:var(--rose);color:#FFFFFF;border-color:var(--rose)}
.gate{position:fixed;inset:0;z-index:100;background:var(--ground);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:28px;text-align:center}
.gate .box{width:100%;max-width:340px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:200;
  background:#FFFFFF;border:1px solid var(--rose);border-radius:8px;padding:13px 15px;
  font-size:13.5px;line-height:1.45;box-shadow:0 6px 20px rgba(42,32,35,.16)}
footer.legal{padding:20px 16px calc(20px + env(safe-area-inset-bottom));text-align:center}

/* ---------- the patient handout ---------- */
#handout{background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px 24px;
  max-width:780px;margin:0 auto;color:#1A1A1A}
.hHead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  border-bottom:2px solid var(--rose);padding-bottom:13px;flex-wrap:wrap}
#handout h3{font-family:var(--display);font-size:16px;font-weight:400;margin:24px 0 9px;
  color:var(--roseDeep);border-bottom:1px solid var(--line);padding-bottom:5px}
table.ht{width:100%;border-collapse:collapse;font-size:13px}
table.ht th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  color:var(--muted);text-transform:uppercase;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
table.ht td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
.hGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.hGrid figure{margin:0}
.hGrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line);
  border-radius:5px;display:block;background:var(--panelHi)}
.hGrid figcaption{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--muted);
  margin-top:5px;text-transform:uppercase;line-height:1.4}
.pGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.pGrid figure{margin:0}
.pGrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line);
  border-radius:6px;display:block;background:var(--panelHi)}
.pGrid figcaption{margin-top:6px;font-size:11.5px;line-height:1.45}
.pGrid figcaption b{display:block;font-size:12.5px;color:#1A1A1A;margin-bottom:2px}
.pGrid figcaption span{color:var(--muted);font-size:10.5px;line-height:1.4;display:block}
/* ---------- report layout ---------- */
.rHead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(100deg,#E5007D 0%,#B0005A 62%,#7A0040 100%);
  margin:-26px -24px 0;padding:20px 24px;border-radius:8px 8px 0 0}
.rDate{border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:8px 12px;text-align:center}
.rTop{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-top:16px}
.rBox{border:1px solid var(--line);border-radius:7px;padding:12px;background:#fff}
.rCentre{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rLbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--muted);
  text-transform:uppercase;margin-bottom:8px}
table.ht.mini td{padding:5px 6px 5px 0;font-size:12px}
.rSection{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:#fff;background:var(--roseDeep);
  padding:7px 12px;border-radius:5px;margin:22px 0 11px;text-transform:uppercase}
.rDials{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px}
.rDial{text-align:center;border:1px solid var(--line);border-radius:7px;padding:10px 5px}
.rdName{font-size:10.5px;margin-top:5px;line-height:1.3}
.rdBand{font-size:9.5px;margin-top:2px}
.estTag{display:inline-block;font-family:var(--mono);font-size:7.5px;letter-spacing:.09em;
  border:1px solid var(--gold);color:var(--gold);border-radius:3px;padding:1px 4px;margin-top:4px}
.rCols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.rConc{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rSev{font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;border:1px solid;
  border-radius:3px;padding:3px 7px;white-space:nowrap}
.rPlan{border-left:3px solid var(--rose);background:var(--panelHi);padding:11px 13px;
  border-radius:0 6px 6px 0;font-size:13px;line-height:1.65;margin-bottom:12px;white-space:pre-wrap}
.fLock{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.fCon{text-align:right;font-size:11.5px;line-height:1.65}
@media(max-width:520px){.fCon{text-align:left}}
.vGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:7px}
.vChip{border:1px solid var(--line);border-radius:6px;padding:8px 9px;font-size:11.5px;line-height:1.35}
.vChip span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;
  color:var(--dim);margin-top:3px;text-transform:uppercase}
.vChip.done{border-color:var(--ok);background:rgba(47,125,95,.07)}
.vChip.done span{color:var(--ok)}
.vChip.shot{border-color:var(--warn)}
.vChip.shot span{color:var(--warn)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:18px 0 4px;
  background:var(--panelHi);border:1px solid var(--line);border-radius:8px;padding:16px}
.hero .heroRing{width:118px;height:118px;flex-shrink:0}
.hero>div{flex:1;min-width:190px}
.dials{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;margin-top:4px}
.dial{text-align:center}
.dial .ring{width:100%;max-width:76px;height:auto}
.dial .dv{font-family:var(--mono);font-size:26px;line-height:1.1;color:var(--roseDeep);padding-top:8px}
.dial .dv span{font-size:13px}
.dial .dl{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.35}
.dial .db{font-size:10.5px;margin-top:2px}
.fine{font-size:11px;color:var(--muted);line-height:1.55;margin:6px 0 0}
.hp{font-size:13px;line-height:1.6;margin:0}
.hSug{border-left:2px solid var(--rose);padding:8px 0 8px 11px;margin-bottom:9px;font-size:13px;line-height:1.5}
.hFoot{margin-top:26px;padding-top:13px;border-top:1px solid var(--line);font-size:11.5px;
  line-height:1.6;color:var(--muted)}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000;padding:0}
  header.top,nav.tabs,.noprint{display:none!important}
  main{padding:0;max-width:none}
  .card{background:#fff;border:1px solid #999;color:#000}
  .metric .mval,.metric .mval.locked{color:#000}
  .sub,.tiny{color:#333}
  #handout{border:none;border-radius:0;padding:0;max-width:none}
  #handout h3{break-after:avoid}
  table.ht tr,.hGrid figure,.pGrid figure,.hSug,.dial,.rDial,.rBox{break-inside:avoid}
  .pGrid{grid-template-columns:repeat(4,1fr)}
  .dials{grid-template-columns:repeat(6,1fr)}
  .rDials{grid-template-columns:repeat(10,1fr)}
  .rTop{grid-template-columns:repeat(4,1fr)}
  .rHead{margin:0 0 4px;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rSection{-webkit-print-color-adjust:exact;print-color-adjust:exact;break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hFoot{break-inside:avoid}
  a{text-decoration:none;color:#000}
}
</style>

<body>

<div class="gate" id="gate">
  <div class="box">
    <div class="wordmark big">AURAA</div>
    <div class="services big">SLIMMING &nbsp;|&nbsp; HAIR &nbsp;|&nbsp; SKIN &nbsp;|&nbsp; LASER</div>
    <div style="height:1px;background:var(--line);margin:20px 0 16px"></div>
    <div style="font-family:var(--display);font-size:23px">Derma-Intelligence</div>
    <p class="sub" id="gateMsg" style="margin:12px 0 18px">Sign in with your clinic email.</p>
    <label class="fld"><span>Email</span><input class="in" id="email" type="email" autocomplete="username" value="auraa.skincare@gmail.com"></label>
    <label class="fld"><span>Password</span><input class="in" id="pass" type="password" autocomplete="current-password"></label>
    <button class="btn solid" id="signin">Sign in</button>
    <p class="tiny" style="margin-top:20px;line-height:1.8">
      SAME LOGIN AS YOUR BILLING APP.<br>PATIENT RECORDS ARE VISIBLE TO THIS ACCOUNT ONLY.
    </p>
  </div>
</div>

<div id="app" class="hide">
  <header class="top">
    <div>
      <div class="wordmark">AURAA</div>
      <div class="name" style="font-size:15px;margin-top:3px">Derma-Intelligence</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="signout">Sign out</button>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <button data-tab="patients" class="on"><span class="g">&#128101;</span>Patients</button>
    <button data-tab="new"><span class="g">&#43;</span>New</button>
    <button data-tab="reports"><span class="g">&#128203;</span>Reports</button>
    <button data-tab="settings"><span class="g">&#9881;</span>Settings</button>
  </nav>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ===================================================================
   CONNECTION
   This is a "publishable" key. It is designed to sit in the page and
   grants nothing by itself — every table is protected by the login
   rules created in Step 1. No secret key is ever placed in this file.
   =================================================================== */
const SUPABASE_URL = "https://pcmmldqcfbslnrmgpoez.supabase.co";
const SUPABASE_KEY = "sb_publishable_ukrht_UV0BRZB_CJ92ocWg_ZfO3wTV_";
const ADMIN_EMAIL  = "auraa.skincare@gmail.com";
const BUCKET       = "derma-photos";
const IG_HANDLE    = "@auraaskincareclinic";
/* Bumped whenever the measurement code changes. Stored with every analysis so
   a report can tell you its numbers were produced by older code and need
   re-running — otherwise you upload a new version, see old scores, and
   reasonably conclude nothing happened. */
const ENGINE_VERSION = 4;

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===================================================================
   HELPERS
   =================================================================== */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { try { return new Date(d).toLocaleDateString("en-GB",
  {day:"numeric",month:"short",year:"numeric"}); } catch(e){ return d; } };
const num = v => (v === "" || v == null) ? null : (isFinite(Number(v)) ? Number(v) : null);

let toastTimer = null;
function toast(msg, ms=2800){
  let t = $("#toast");
  if(!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), ms);
}
function fail(e){
  console.error(e);
  toast(e && e.message ? "Problem: " + e.message : "Something went wrong.", 5000);
}

/* ===================================================================
   WHAT THE REPORT MEASURES
   ai    = measured by the engine. LOCKED, never editable.
   you   = your clinical grade. Editable.
   meas  = a scalp measurement you take yourself.
   =================================================================== */
/* The capture protocol as real records. Each analysed photo is stored against
   its own view so nothing overwrites anything else. */
const VIEWS = [
  { k:"front",     name:"Front",               kind:"skin", side:null    },
  { k:"left45",    name:"Left 45\u00B0",          kind:"skin", side:"left"  },
  { k:"right45",   name:"Right 45\u00B0",         kind:"skin", side:"right" },
  { k:"leftprof",  name:"Left profile",        kind:"skin", side:"left"  },
  { k:"rightprof", name:"Right profile",       kind:"skin", side:"right" },
  { k:"forehead",  name:"Chin down (forehead)",kind:"skin", side:null    },
  { k:"jaw",       name:"Chin up (jaw/neck)",  kind:"skin", side:null    },
  { k:"closeup",   name:"Close-up of concern", kind:"skin", side:null    },
  { k:"vertex",    name:"Vertex (top)",        kind:"hair", side:null    },
  { k:"hairline",  name:"Frontal hairline",    kind:"hair", side:null    },
  { k:"crown",     name:"Crown",               kind:"hair", side:null    },
  { k:"parting",   name:"Parting close-up",    kind:"hair", side:null    }
];
const viewName = k => (VIEWS.find(v=>v.k===k)||{}).name || k || "Unlabelled";

/* Combine every analysed view into one assessment.
   Scores are averaged across views. Counts take the worst single view and are
   never summed, because the views overlap and the same lesion appears twice. */
const SCORE_KEYS = ["pigment","pigmentUneven","redness","rednessUneven","oiliness",
                    "texture","wrinkles","pores","blemishes","scarring","hydration",
                    "barrier","elasticity"];
const COUNT_KEYS = ["spotCount","wrinkleCount","poreCount","scarCount",
                    "spotAreaRatio","scarAreaRatio"];

function aggregateViews(views){
  const keys=Object.keys(views||{});
  if(!keys.length) return null;
  const out={ _views:keys.length, _viewList:keys };
  for(const k of SCORE_KEYS){
    const vals=keys.map(v=>views[v][k]).filter(v=>v!=null && isFinite(v));
    if(vals.length) out[k]=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  }
  for(const k of COUNT_KEYS){
    const vals=keys.map(v=>views[v][k]).filter(v=>v!=null && isFinite(v));
    if(vals.length){
      out[k]=Math.round(Math.max.apply(null,vals)*100)/100;
      out[k+"_perView"]=Object.fromEntries(keys.map(v=>[v,views[v][k]]));
    }
  }
  const parts=[out.pigmentUneven,out.redness,out.texture,out.blemishes,
               out.wrinkles,out.pores,out.scarring].filter(v=>v!=null);
  if(parts.length) out.healthScore=Math.round(100-parts.reduce((a,b)=>a+b,0)/parts.length);
  return out;
}

/* Left against right. Only meaningful because both sides were photographed
   the same way, minutes apart, under the same light. */
const ASYM_KEYS=[["pigment","pigmentation"],["pigmentUneven","uneven pigment"],
                 ["redness","redness"],["blemishes","spots"],["scarring","scarring"]];
function findAsymmetry(views){
  const L=views.left45||views.leftprof, R=views.right45||views.rightprof;
  if(!L||!R) return [];
  const out=[];
  for(const pair of ASYM_KEYS){
    const k=pair[0], label=pair[1];
    const a=L[k], b=R[k];
    if(a==null||b==null) continue;
    const diff=a-b;
    if(Math.abs(diff)<12) continue;         // below this it is noise, not a finding
    out.push({ key:k, label, heavier: diff>0 ? "left" : "right",
               left:a, right:b, diff:Math.abs(diff) });
  }
  return out.sort((x,y)=>y.diff-x.diff);
}

   =================================================================== */
$("#signin").onclick = async () => {
  const email = $("#email").value.trim(), password = $("#pass").value;
  if(!email || !password){ $("#gateMsg").textContent = "Enter your email and password."; return; }
  $("#signin").disabled = true; $("#signin").textContent = "Signing in…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $("#signin").disabled = false; $("#signin").textContent = "Sign in";
  if(error){ $("#gateMsg").textContent = "That did not work: " + error.message; return; }
  await checkSession();
};
$("#pass").addEventListener("keydown", e => { if(e.key === "Enter") $("#signin").click(); });
$("#signout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function checkSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("#gate").classList.remove("hide"); $("#app").classList.add("hide"); return; }
  if(session.user.email !== ADMIN_EMAIL){
    await sb.auth.signOut();
    $("#gateMsg").textContent = "That account cannot open patient records. Clinical data is restricted to the clinic admin account.";
    return;
  }
  $("#gate").classList.add("hide");
  $("#app").classList.remove("hide");
  go("patients");
}

   =================================================================== */
let TAB = "patients", CTX = {}, searchQ = "";
$$("nav.tabs button").forEach(b => b.onclick = () => go(b.dataset.tab));

function go(tab, ctx={}){
  TAB = tab; CTX = ctx;
  $$("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  render();
}
async function render(){
  const v = $("#view");
  v.innerHTML = `<div class="sub">Loading…</div>`;
  try {
    if(TAB === "patients")      v.innerHTML = await viewPatients();
    else if(TAB === "patient")  v.innerHTML = await viewPatient(CTX.id);
    else if(TAB === "edit")     v.innerHTML = await viewEdit(CTX.id);
    else if(TAB === "new")      v.innerHTML = await viewEdit(null);
    else if(TAB === "reports")  v.innerHTML = await viewReports();
    else if(TAB === "report")   v.innerHTML = await viewReport(CTX.id);
    else if(TAB === "handout")  v.innerHTML = await viewHandout(CTX.id);
    else if(TAB === "settings") v.innerHTML = await viewSettings();
    window.scrollTo(0,0);
    await wireUp();
  } catch(err){
    v.innerHTML = `<div class="banner bad">Could not load: ${esc(err.message)}</div>`;
  }
}

function fieldHTML(f, val){
  const [k, label, type] = f;
  if(type === "area")
    return `<label class="fld"><span>${esc(label)}</span><textarea class="in" data-f="${k}">${esc(val)}</textarea></label>`;
  if(type.startsWith("select:")){
    const opts = type.slice(7).split(",");
    return `<label class="fld"><span>${esc(label)}</span><select class="in" data-f="${k}">${
      opts.map(o => `<option value="${esc(o)}"${String(val ?? "")===o?" selected":""}>${o||"—"}</option>`).join("")}</select></label>`;
  }
  return `<label class="fld"><span>${esc(label)}</span><input class="in" type="${type}" data-f="${k}" value="${esc(val)}"></label>`;
}

function metricRow(m, val, kind){
  const has = val !== "" && val != null;
  const chip = kind === "ai"   ? `<span class="chip ai">AI MEASURED · LOCKED</span>`
             : kind === "meas" ? `<span class="chip">YOUR MEASUREMENT</span>`
             :                   `<span class="chip you">YOUR GRADE · EDITABLE</span>`;
  if(kind === "ai"){
    const pct = has ? Math.max(0, Math.min(100, Number(val))) : 0;
    return `<div class="metric">
      <div class="mtop">
        <span class="mname">${esc(m.label)}</span>
        <span class="mval locked">${has?esc(val):"—"}<span style="font-size:11px;color:var(--dim)"> ${esc(m.unit||"")}</span></span>
      </div>
      ${has ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}
      <div style="margin-top:5px">${chip}</div>
    </div>`;
  }
  const input = m.opts
    ? `<select class="in" data-m="${kind}:${m.k}" style="margin-top:8px">${
        m.opts.map(o => `<option value="${esc(o)}"${String(val ?? "")===o?" selected":""}>${o||"—"}</option>`).join("")}</select>`
    : `<input class="in" type="${m.num||m.unit?"number":"text"}" step="any" data-m="${kind}:${m.k}"
        value="${esc(val)}" placeholder="${esc(m.hint||m.unit||"")}" style="margin-top:8px">`;
  return `<div class="metric">
    <div class="mtop"><span class="mname">${esc(m.label)}</span>${chip}</div>${input}
  </div>`;
}

/* ===================================================================
   HAIR & SCALP ENGINE
   Separate from the skin engine by design: different measurements,
   different failure modes, different clinical meaning.

   Measured here: how much scalp shows through, parting width, hair
   shafts crossing the parting and their relative thickness, scalp
   redness, and flaking.

   NOT measured, and deliberately absent: follicular density per cm2,
   miniaturisation percentage, terminal-to-vellus ratio and shaft
   diameter in microns. Those need dermoscopy with a calibrated scale.
   Pattern diagnoses (telogen effluvium, alopecia areata, scarring
   alopecia) are clinical judgements and are recorded by the doctor,
   never produced by this code.
   =================================================================== */
/* ==================================================================
   Scalp & hair measurement from an ordinary photograph.
   Every pixel is classified as hair, visible scalp, or neither.
   Coverage is then the ratio between the first two — which is what
   actually changes when treatment works.
   ================================================================== */
function isScalpTone(r,g,b){
  const sum=r+g+b;
  if(sum<70||sum>720) return false;
  const rn=r/sum, gn=g/sum, bn=b/sum;
  if(rn<0.365||rn>0.56) return false;
  if(gn<0.26||gn>0.40) return false;
  if(bn>0.335) return false;
  if(r<g||g<b) return false;
  return true;
}

/* Otsu: find the brightness that best splits the photo into two groups.
   Hair and scalp differ in brightness far more reliably than in colour —
   dark hair is nearly neutral, so a colour test alone calls it skin. */
function otsu(vals){
  const hist=new Float64Array(256);
  for(const v of vals) hist[Math.max(0,Math.min(255,Math.round(v)))]++;
  const total=vals.length;
  let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i];
  let sumB=0,wB=0,best=0,thr=128;
  for(let t=0;t<256;t++){
    wB+=hist[t]; if(!wB) continue;
    const wF=total-wB; if(!wF) break;
    sumB+=t*hist[t];
    const mB=sumB/wB, mF=(sum-sumB)/wF;
    const between=wB*wF*(mB-mF)*(mB-mF);
    if(between>best){ best=between; thr=t; }
  }
  return thr;
}

function classify(px,w,h){
  const n=w*h, lum=new Float32Array(n);
  const all=[];
  for(let i=0;i<n;i++){
    const y=0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2];
    lum[i]=y; all.push(y);
  }
  const thr=otsu(all);
  const kind=new Uint8Array(n);
  let scalp=0, hair=0, brightSum=0;
  for(let i=0;i<n;i++){
    const r=px[i*4],g=px[i*4+1],b=px[i*4+2];
    if(lum[i] > thr){
      if(isScalpTone(r,g,b)){ kind[i]=1; scalp++; brightSum+=lum[i]; }
    } else {
      const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
      if(mx-mn <= mx*0.60){ kind[i]=2; hair++; }
    }
  }
  const analysed=scalp+hair;
  const scalpLum = scalp ? brightSum/scalp : thr*1.2;
  /* A photo of nothing but hair still has a bright half and a dark half, and
     Otsu will happily split it — reporting 50% scalp on a full head of hair.
     Require the two groups to be genuinely far apart in brightness before any
     coverage figure is allowed out. */
  let hairSum=0;
  for(let i=0;i<n;i++) if(kind[i]===2) hairSum+=lum[i];
  const hairLum = hair ? hairSum/hair : 0;
  const separation = hairLum>0 ? scalpLum/hairLum : 0;
  const separable = scalp>n*0.004 && hair>n*0.004 && separation>=1.55;
  return { kind, scalp, hair, analysed, scalpLum, hairLum,
           separation:+separation.toFixed(2), threshold:thr, separable,
           coverage: analysed ? +(hair/analysed*100).toFixed(1) : null,
           scalpVisible: analysed ? +(scalp/analysed*100).toFixed(1) : null };
}

/* Parting width: the widest continuous run of visible scalp per row.
   Reported in pixels — comparable between visits at a fixed distance,
   NOT a millimetre measurement. */
function partingWidth(kind,w,h){
  const runs=[];
  for(let y=0;y<h;y++){
    let best=0,cur=0;
    for(let x=0;x<w;x++){
      if(kind[y*w+x]===1){ cur++; if(cur>best) best=cur; } else cur=0;
    }
    if(best>0) runs.push(best);
  }
  if(runs.length<h*0.15) return null;
  runs.sort((a,b)=>a-b);
  return { median:runs[Math.floor(runs.length*0.5)], p90:runs[Math.floor(runs.length*0.9)] };
}
/* Flakes: small bright near-neutral specks sitting on scalp. */
function detectFlakes(px,kind,w,h,scalpLum){
  const n=w*h, hot=new Uint8Array(n);
  const nearScalp=(i)=>{
    const x=i%w,y=(i/w)|0;
    for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
      const xx=x+dx, yy=y+dy;
      if(xx<0||yy<0||xx>=w||yy>=h) continue;
      if(kind[yy*w+xx]===1) return true;
    }
    return false;
  };
  for(let i=0;i<n;i++){
    if(kind[i]===2) continue;                  // inside hair, not scalp flaking
    const r=px[i*4],g=px[i*4+1],b=px[i*4+2];
    const y=0.299*r+0.587*g+0.114*b;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    // a flake is brighter than the scalp around it and close to colourless
    if(y > scalpLum*1.22 && (mx-mn) < mx*0.22 && nearScalp(i)) hot[i]=1;
  }
  const seen=new Uint8Array(n), out=[], stack=new Int32Array(n);
  for(let s=0;s<n;s++){
    if(!hot[s]||seen[s]) continue;
    let sp=0; stack[sp++]=s; seen[s]=1; let c=0,sx=0,sy=0;
    while(sp){
      const i=stack[--sp]; c++; sx+=i%w; sy+=(i/w)|0;
      const x=i%w,y=(i/w)|0;
      if(x>0&&hot[i-1]&&!seen[i-1]){seen[i-1]=1;stack[sp++]=i-1;}
      if(x<w-1&&hot[i+1]&&!seen[i+1]){seen[i+1]=1;stack[sp++]=i+1;}
      if(y>0&&hot[i-w]&&!seen[i-w]){seen[i-w]=1;stack[sp++]=i-w;}
      if(y<h-1&&hot[i+w]&&!seen[i+w]){seen[i+w]=1;stack[sp++]=i+w;}
    }
    if(c>=3 && c<=800) out.push({x:Math.round(sx/c),y:Math.round(sy/c),area:c,
                                 r:Math.max(2,Math.round(Math.sqrt(c/Math.PI)*1.7))});
  }
  let scalpPx=0; for(let i=0;i<n;i++) if(kind[i]===1) scalpPx++;
  return { flakes:out, count:out.length,
           coverage: scalpPx ? +(out.reduce((a,f)=>a+f.area,0)/scalpPx*100).toFixed(2) : 0 };
}

/* Hair shafts crossing visible scalp. Widths are in pixels — comparable
   between visits at a fixed distance, never presented as microns. */
function detectShafts(px, kind, w, h){
  const lum=new Float32Array(w*h).fill(-1);
  const mask=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++){
    if(kind[i]===0) continue;
    mask[i]=1;
    lum[i]=0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2];
  }
  const ridge=ridgeResponse(lum,w,h,mask,2);
  const blobs=connectedBlobs(ridge,w,h,mask,6,8,Math.round(w*h*0.02))
    .filter(b=>b.elong>=2.2 && b.len>=6);
  const widths=blobs.map(b=>Math.max(1, b.area/Math.max(1,b.len)));
  widths.sort((a,b)=>a-b);
  const med = widths.length ? widths[Math.floor(widths.length*0.5)] : 0;
  let fine=0, medium=0, coarse=0;
  for(const wd of widths){
    if(wd < med*0.80) fine++; else if(wd > med*1.25) coarse++; else medium++;
  }
  const tot=Math.max(1,widths.length);
  return { shafts:blobs, count:blobs.length, medianWidth:+med.toFixed(2),
           fine:+(fine/tot*100).toFixed(1), medium:+(medium/tot*100).toFixed(1),
           coarse:+(coarse/tot*100).toFixed(1) };
}

function analyseScalpPhoto(px,w,h){
  const cls = classify(px,w,h);
  if(!cls.separable)
    return { ok:false, reason:"Scalp and hair could not be told apart in this photo. "
      + "Part the hair with a comb and hold it open, and make sure the scalp is lit." };

  const flakes  = detectFlakes(px, cls.kind, w, h, cls.scalpLum);
  const shafts  = detectShafts(px, cls.kind, w, h);
  const parting = partingWidth(cls.kind, w, h);

  // redness of the visible scalp only
  const hems=[]; const hemMap=new Float32Array(w*h).fill(NaN);
  for(let i=0;i<w*h;i++){
    if(cls.kind[i]!==1) continue;
    const o=unmix(px[i*4],px[i*4+1],px[i*4+2]);
    hems.push(o.hem); hemMap[i]=o.hem;
  }
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const sc=(v,lo,hi)=>Math.round(Math.max(0,Math.min(100,((v-lo)/(hi-lo))*100)));

  const m = {
    hairCoverage:  cls.coverage,
    scalpVisible:  cls.scalpVisible,
    partingPx:     parting ? parting.median : null,
    shaftCount:    shafts.count,
    shaftFine:     shafts.fine,
    shaftMedium:   shafts.medium,
    shaftCoarse:   shafts.coarse,
    flakeCount:    flakes.count,
    // severity scores, higher = worse
    densityScore:  sc(cls.scalpVisible, 4, 45),
    scalpRedness:  sc(mean(hems), 0.02, 0.70),
    dandruff:      sc(flakes.coverage, 0, 8),
    breakage:      sc(shafts.fine, 15, 55)
  };
  const parts=[m.densityScore, m.scalpRedness, m.dandruff, m.breakage];
  m.hairHealthScore = Math.round(100 - parts.reduce((a,b)=>a+b,0)/parts.length);

  return { ok:true, metrics:m, cls, flakes, shafts, parting,
           maps:{ hemMap, kind:cls.kind, w, h } };
}

/* Scalp panels: scalp-visibility, flaking, shafts, redness. */
function renderScalpPanel(px,w,h,cls,kindWanted,marks,rgb){
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d"); const im=ctx.createImageData(w,h);
  for(let i=0;i<w*h;i++){
    const r=px[i*4],g=px[i*4+1],b=px[i*4+2];
    const y=0.299*r+0.587*g+0.114*b;
    let R=r*0.5+y*0.5, G=g*0.5+y*0.5, B=b*0.5+y*0.5;
    R=R*0.85+255*0.15; G=G*0.85+255*0.15; B=B*0.85+255*0.15;
    if(kindWanted && cls.kind[i]===kindWanted){
      const a=0.55;
      R=R*(1-a)+rgb[0]*a; G=G*(1-a)+rgb[1]*a; B=B*(1-a)+rgb[2]*a;
    }
    im.data[i*4]=R; im.data[i*4+1]=G; im.data[i*4+2]=B; im.data[i*4+3]=255;
  }
  ctx.putImageData(im,0,0);
  if(marks && marks.length){
    ctx.lineWidth=Math.max(1,Math.min(w,h)/450);
    for(const s of marks){
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r||3,0,Math.PI*2);
      ctx.fillStyle="rgba(255,255,255,.45)"; ctx.fill();
      ctx.strokeStyle="rgba(0,140,190,.95)"; ctx.stroke();
    }
  }
  return c.toDataURL("image/jpeg",0.9);
}

  blemishes:     ["Blemishes","How densely spots and marks are distributed."],
  wrinkles:      ["Wrinkles","How many lines and creases are present, and how deep."],
  scarring:      ["Acne scarring","How much of the surface shows depressions consistent with acne scarring."],
  hydration:     ["Dryness appearance","How dry the skin looks. Appearance only — not a moisture reading."],
  healthScore:   ["Overall Skin Health Score","A plain average of the six measures above, inverted so a higher number is better skin."]
};
const BANDS = v => v<25 ? ["Low","var(--ok)"] : v<50 ? ["Mild","var(--ok)"]
             : v<75 ? ["Moderate","var(--warn)"] : ["High","var(--bad)"];

const PANEL_TEXT = {
  spots:   ["Spot Analysis Map","Each circle is a discrete spot standing measurably above the surrounding skin. Red rings mark the strongest."],
  brown:   ["Pigmentation Analysis Map","Where melanin sits highest relative to the skin around it."],
  red:     ["Erythema Analysis Map","Where blood and inflammation sit closest to the surface."],
  scar:    ["Acne Scar Analysis Map","Surface depressions consistent with acne scarring, each one marked."],
  wrinkle: ["Wrinkle Analysis Map","Lines and creases, separated from pores by their elongated shape."],
  pore:    ["Pore Analysis Map","Individual pore openings, separated from wrinkles by their round shape."],
  texture: ["Texture Analysis Map","Where the surface is roughest."],
  shine:   ["Surface Shine Map","Where the surface reflects most light — a guide to oiliness on the day."]
};

const NOTE_NO_REFERENCE = "<br><br><b>Note:</b> no colour reference was present in these photographs, "
  + "so these scores should not be compared directly against another day's photographs.";
const NOTE_DEEP_TONE = "<br><br><b>Note:</b> deeper skin tones sit near the limit of what a camera can "
  + "separate. The pigment figure here is indicative, and Dr. Fatima's own grading takes precedence.";

const SUGGESTIONS = [
  { when:m => m.pigmentUneven>=50, title:"Uneven pigment",
    options:"Chemical peel · laser toning · topical brightening protocol",
    note:"Patch test first on Fitzpatrick IV–VI. Rebound pigmentation is the main risk." },
  { when:m => m.pigment>=65, title:"High overall pigment",
    options:"Daily broad-spectrum SPF · pigment-directed topicals",
    note:"Sun protection outperforms every in-clinic option here." },
  { when:m => m.redness>=55, title:"Raised redness",
    options:"Barrier repair · anti-inflammatory protocol · settle before actives",
    note:"Treat inflammation before starting peels or lasers." },
  { when:m => m.oiliness>=35, title:"Oily / congested",
    options:"Hydrafacial · salicylic peel · pore-directed protocol", note:"" },
  { when:m => m.texture>=55, title:"Rough texture",
    options:"Microneedling · resurfacing peel · PRP", note:"" },
  { when:m => m.hydration>=55, title:"Looks dry",
    options:"Hydrafacial · barrier and hydration protocol",
    note:"Correct dryness before any active treatment." }
];

/* Directly observable vs AI-estimated. Kept apart everywhere, exactly as
   your specification requires. Scores are shown as QUALITY (higher = better),
   converted from the severity figures the engine produces. */
const DIAL_SPEC = [
  { k:"texture",       name:"Texture",      obs:true  },
  { k:"pores",         name:"Pores",        obs:true  },
  { k:"pigmentUneven", name:"Pigmentation", obs:true  },
  { k:"wrinkles",      name:"Wrinkles",     obs:true  },
  { k:"redness",       name:"Redness",      obs:true  },
  { k:"blemishes",     name:"Acne / Spots", obs:true  },
  { k:"scarring",      name:"Acne Scarring",obs:true  },
  { k:"oiliness",      name:"Oiliness",     obs:true  },
  { k:"hydration",     name:"Hydration",    obs:false },
  { k:"barrier",       name:"Skin Barrier", obs:false },
  { k:"elasticity",    name:"Elasticity",   obs:false }
];
const qualityOf = (ai,k) => {
  if(ai[k] == null) return null;
  return Math.max(0, Math.min(100, 100 - Number(ai[k])));
};
/* Bands matched to the reference report: 78+ Good, 65–77 Moderate, 50–64 Needs care. */
const QBAND = q => q>=78 ? ["Good","var(--ok)"] : q>=65 ? ["Moderate","var(--warn)"]
                 : q>=50 ? ["Needs care","var(--warn)"] : ["Priority","var(--bad)"];

function dialSVG(q,col,size){
  const C=2*Math.PI*26;
  return `<svg viewBox="0 0 64 64" style="width:${size}px;height:${size}px">
    <circle cx="32" cy="32" r="26" fill="none" stroke="#ECE4E8" stroke-width="6"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-q/100)).toFixed(1)}"
      transform="rotate(-90 32 32)"/>
    <text x="32" y="38" text-anchor="middle" font-size="19" font-family="var(--mono)" fill="#1A1A1A">${q}</text>
  </svg>`;
}

  return `
  <div class="noprint" style="margin-bottom:14px">
    <button class="btn ghost sm" data-report="${id}">‹ Back to the analysis</button>
    ${stale?`<div class="banner bad" style="margin-top:10px"><b>Out of date.</b>

      <b>Analyse</b> on the photo to recalculate before printing this.</div>`:""}

      <button class="btn solid" id="printHandout">Print / save as PDF</button>
    </div>
    <p class="sub" style="margin-top:9px">In the print box choose <b>Save as PDF</b>.
      ${r.signed?"":"<b style='color:var(--warn)'>Draft — sign it off before giving it to a patient.</b>"}</p>
  </div>

  <div id="handout">
    <!-- ===== masthead ===== -->
    <div class="rHead">
      <div>
        <div class="wordmark" style="font-size:30px;color:#fff">AURAA</div>
        <div style="font-family:var(--display);font-size:8.5px;letter-spacing:.14em;color:#FFD9EC;margin-top:5px">
          SLIMMING &nbsp;|&nbsp; HAIR &nbsp;|&nbsp; SKIN &nbsp;|&nbsp; LASER</div>
        <div style="font-family:var(--display);font-style:italic;font-size:11px;color:#fff;margin-top:6px">
          Discover the New You.</div>
      </div>
      <div style="text-align:center;flex:1;min-width:180px">
        <div style="font-family:var(--display);font-size:19px;color:#fff;letter-spacing:.02em">
          AI SKIN ANALYSIS REPORT</div>
        <div style="font-size:9px;color:#FFD9EC;letter-spacing:.12em;margin-top:4px">
          AURAA SKINCARE CLINIC &nbsp;·&nbsp; HYDERABAD</div>
      </div>
      <div class="rDate">
        <div style="font-size:8.5px;letter-spacing:.12em;color:#FFD9EC">ANALYSIS DATE</div>
        <div style="font-size:12.5px;color:#fff;margin-top:3px">${fmtDate(r.report_date)}</div>
      </div>
    </div>

    <!-- ===== top strip ===== -->
    <div class="rTop">
      <div class="rBox">
        <div class="rLbl">PATIENT DETAILS</div>
        <table class="ht mini"><tbody>
          <tr><td>Name</td><td><b>${esc(p.name)}</b></td></tr>

          ${p.sex?`<tr><td>Sex</td><td>${esc(p.sex)}</td></tr>`:""}

      ${health!=null?`<div class="rBox rCentre">

      ${skinAge!=null?`<div class="rBox rCentre">

    </div>

    <!-- ===== maps ===== -->
    ${(clinical.length||maps.length)?`<div class="rSection">SKIN ANALYSIS MAPS</div>
    <div class="pGrid">
      ${clinical.map(x=>`<figure><img data-path="${esc(x.storage_path)}">

      ${maps.map(x=>{const k=x.view_label.split(":")[1]; const t=PANEL_TEXT[k]||SCALP_PANEL_TEXT[k]||["",""];
        return `<figure><img data-path="${esc(x.storage_path)}">
          <figcaption><b>${esc(t[0])}</b><span>${esc(t[1])}</span></figcaption></figure>`;}).join("")}
    </div>`:""}

    <!-- ===== per view ===== -->
    ${(ai._byView && Object.keys(ai._byView).length>1)?(function(){
      const vk=Object.keys(ai._byView);
      const rows=[["pigmentUneven","Pigmentation"],["redness","Redness"],
                  ["texture","Texture"],["blemishes","Acne / spots"],
                  ["scarring","Scarring"],["pores","Pores"]];
      return `<div class="rSection">VIEW BY VIEW</div>
      <table class="ht"><thead><tr><th>Measure</th>
        ${vk.map(v=>`<th>${esc(viewName(v))}</th>`).join("")}</tr></thead><tbody>
      ${rows.map(([k,label])=>{
        const cells=vk.map(v=>{const s=ai._byView[v][k];
          if(s==null) return `<td class="mono">—</td>`;

        return `<tr><td>${label}</td>${cells.join("")}</tr>`;}).join("")}
      </tbody></table>
      <p class="fine">Each column is a separate photograph, measured on its own. Higher is better.
      The dials above are the average across all views.</p>`;})():""}

    <!-- ===== asymmetry ===== -->
    ${(ai._asym && ai._asym.length)?`<div class="rSection">LEFT AND RIGHT COMPARED</div>
      <table class="ht"><tbody>
      ${ai._asym.map(a=>`<tr>
        <td style="width:34%"><b>${esc(a.label.charAt(0).toUpperCase()+a.label.slice(1))}</b></td>
        <td><b style="color:var(--roseDeep)">${a.heavier==="left"?"Left side heavier":"Right side heavier"}</b>

        <p class="fine">Options for discussion, not a prescription. Suitability is decided by

      </div>`:"<div></div>"}
    </div>

    <!-- ===== progress ===== -->
    <div class="rSection">PROGRESS</div>
    ${priors&&priors.length?(function(){
      const pa=priors[0].ai||{};
      const rows=DIAL_SPEC.map(d=>{
        const a=qualityOf(pa,d.k), b=qualityOf(ai,d.k);
        if(a==null||b==null||a===0) return "";
        const diff=b-a; if(diff===0) return "";
        return `<tr><td>${esc(d.name)}</td><td class="mono">${a} → ${b}</td>

      }).join("");
      return rows?`<table class="ht"><thead><tr><th>Measure</th><th>Then → now</th><th>Change</th></tr></thead>
        <tbody>${rows}</tbody></table>
        <p class="fine">Measured change since ${fmtDate(priors[0].report_date)}. Not an estimate.</p>`
        :`<p class="hp">No measurable change since ${fmtDate(priors[0].report_date)}.</p>`;
    })():`<p class="hp">This visit records your <b>baseline</b>. From your next visit onward, every

      <p class="fine">We do not show simulated "after" images. A predicted photograph is a promise

    <!-- ===== limits ===== -->
    <div class="rSection">HOW TO READ THIS REPORT</div>
    <table class="ht"><tbody>
      <tr><td style="width:32%"><b>Directly observed</b></td>

    ${m.lowConfidencePercent>40?`<p class="fine"><b>Note:</b> deeper skin tones sit near the limit of

    <div class="hFoot">
      <div class="fLock">
        <div>
          <div class="wordmark" style="font-size:20px">AURAA</div>
          <div style="font-family:var(--display);font-style:italic;font-size:11px;color:var(--muted);margin-top:3px">
            Discover the New You.</div>
        </div>
        <div class="fCon">
          <div><b>Auraa Skincare Clinic</b></div>
          <div>Falcon Valley Road, opp. D-Mart, Film Nagar, Hyderabad 500008</div>
          <div>+91 91008 76662 &nbsp;·&nbsp; auraaskincare.com &nbsp;·&nbsp; ${esc(IG_HANDLE)}</div>
        </div>
      </div>
      <div class="fine" style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
        <b>Disclaimer.</b> This report is generated from photographs taken during your consultation and is
        intended to support discussion with your treating doctor. It is not a diagnosis, does not replace
        clinical examination or medical advice, and should not be used to start or stop any treatment on its
        own. Scores describe the images captured on the date shown and can be affected by lighting, camera
        and skin condition on the day. Individual results vary. Any treatment discussed is subject to
        assessment of your medical history, allergies and current medication by Dr. Fatima Sajeeda.
        ${r.signed?`Reviewed and signed by Dr. Fatima Sajeeda on ${fmtDate(r.signed_at)}.`
                  :"<b>DRAFT — NOT YET REVIEWED BY THE DOCTOR.</b>"}
      </div>
    </div>
  </div>`;
}

  <div class="banner info">
    <b>This needs internet.</b> Records live in Supabase, so if the clinic wifi drops the app will not
    load new patients until it comes back.
  </div>

  <button class="btn ghost" id="exportAll">Download all records as a file</button>

      PATIENT RECORDS ARE RESTRICTED TO THE CLINIC ADMIN ACCOUNT.<br>
