<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Derma-Intelligence">
<meta name="theme-color" content="#FFFFFF">
<title>Auraa · Derma-Intelligence</title>
<style>
:root{
  /* Auraa brand. Magenta and black on white, taken from the clinic logo.
     Near-white page so skin tone in photos is judged accurately.
     Variable names kept from the original design. */
  --ground:#FAF7F9; --panel:#FFFFFF; --panelHi:#F7F2F5; --line:#E8E2E5;
  --rose:#E5007D;        /* Auraa magenta */
  --roseDeep:#C40065;    /* darker magenta, for small text */
  --gold:#8A6F14; --cream:#1A1A1A; --muted:#6B6266; --dim:#7C737A;
  --ok:#2F7D5F; --warn:#9C6410; --bad:#B3453F; --info:#3E6A97;
  --mono:'SF Mono','Roboto Mono',Menlo,ui-monospace,monospace;
  --display:'Iowan Old Style','Palatino Linotype',Georgia,serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ground);color:var(--cream);font-family:var(--body);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
.hide{display:none!important}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--roseDeep);text-transform:uppercase}
/* brand lockup, matching the clinic logo */
.wordmark{font-family:var(--display);color:var(--rose);letter-spacing:.20em;
  font-size:19px;line-height:1;font-weight:400}
.wordmark.big{font-size:40px;letter-spacing:.22em}
.services{font-family:var(--display);color:var(--cream);letter-spacing:.10em;
  font-size:9.5px;margin-top:7px;line-height:1}
.services.big{font-size:12px;margin-top:11px}
.eyebrow.dim{color:var(--dim)}
h2.disp{font-family:var(--display);font-size:24px;font-weight:400;margin:6px 0 4px}
.mono{font-family:var(--mono)}
.sub{color:var(--muted);font-size:13px;line-height:1.55}
.tiny{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .name{font-family:var(--display);font-size:17px}
header.top .spacer{flex:1}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;
  min-width:44px;height:36px;font-size:12px;padding:0 10px}
main{padding:16px 16px 24px;max-width:820px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:transparent;border:none;color:var(--dim);padding:10px 4px 12px;
  font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
nav.tabs button .g{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--rose)}
.btn{background:transparent;border:1px solid var(--rose);color:var(--cream);border-radius:6px;
  padding:12px 16px;font-size:14px;min-height:46px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;width:100%}
.btn.solid{background:var(--rose);color:#FFFFFF;font-weight:600;border-color:var(--rose)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{width:auto;padding:9px 14px;min-height:40px;font-size:13px}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{width:auto;flex:1;min-width:130px}
label.fld{display:block;margin-bottom:12px}
label.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input.in,select.in,textarea.in{width:100%;padding:12px;background:var(--panelHi);
  border:1px solid var(--line);color:var(--cream);border-radius:6px;min-height:46px}
textarea.in{min-height:76px;resize:vertical;line-height:1.5}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--rose)}
.chip{font-family:var(--mono);font-size:9px;padding:3px 7px;border-radius:3px;
  border:1px solid var(--line);color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.chip.ai{border-color:var(--info);color:var(--info)}
.chip.you{border-color:var(--gold);color:var(--gold)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:13px;margin-bottom:9px;
  box-shadow:0 1px 2px rgba(42,32,35,.05)}
.card.tap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--cream)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--line);color:var(--rose);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;flex-shrink:0}
.banner{padding:11px 13px;border-radius:6px;background:var(--panel);border-left:3px solid var(--warn);
  font-size:12.5px;line-height:1.55;margin-bottom:9px;color:var(--cream)}
.banner.bad{border-left-color:var(--bad)}
.banner.ok{border-left-color:var(--ok)}
.banner.info{border-left-color:var(--info)}
.metric{border-bottom:1px solid var(--line);padding:12px 0}
.metric:last-child{border-bottom:none}
.metric .mtop{display:flex;align-items:center;gap:8px;justify-content:space-between}
.metric .mname{font-size:14px}
.metric .mval{font-family:var(--mono);font-size:19px}
.metric .mval.locked{color:var(--info)}
.bar{height:5px;background:var(--panelHi);border-radius:3px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--info);border-radius:3px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:var(--panelHi)}
.thumbwrap{position:relative}
.thumbwrap button.del{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.94);border:1px solid var(--line);
  color:var(--bad);border-radius:4px;width:26px;height:26px;font-size:13px;line-height:1;padding:0;
  box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pill{padding:8px 13px;border-radius:20px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  background:transparent;border:1px solid var(--line);color:var(--muted);min-height:38px}
.pill.on{background:var(--rose);color:#FFFFFF;border-color:var(--rose)}
.gate{position:fixed;inset:0;z-index:100;background:var(--ground);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:28px;text-align:center}
.gate .box{width:100%;max-width:340px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:200;
  background:#FFFFFF;border:1px solid var(--rose);border-radius:8px;padding:13px 15px;
  font-size:13.5px;line-height:1.45;box-shadow:0 6px 20px rgba(42,32,35,.16)}
footer.legal{padding:20px 16px calc(20px + env(safe-area-inset-bottom));text-align:center}
@media print{
  body{background:#fff;color:#000;padding:0}
  header.top,nav.tabs,.noprint{display:none!important}
  .card{background:#fff;border:1px solid #999;color:#000}
  .metric .mval,.metric .mval.locked{color:#000}
  .sub,.tiny{color:#333}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <div class="wordmark big">AURAA</div>
    <div class="services big">SLIMMING &nbsp;|&nbsp; HAIR &nbsp;|&nbsp; SKIN &nbsp;|&nbsp; LASER</div>
    <div style="height:1px;background:var(--line);margin:20px 0 16px"></div>
    <div style="font-family:var(--display);font-size:23px">Derma-Intelligence</div>
    <p class="sub" id="gateMsg" style="margin:12px 0 18px">Sign in with your clinic email.</p>
    <label class="fld"><span>Email</span><input class="in" id="email" type="email" autocomplete="username" value="auraa.skincare@gmail.com"></label>
    <label class="fld"><span>Password</span><input class="in" id="pass" type="password" autocomplete="current-password"></label>
    <button class="btn solid" id="signin">Sign in</button>
    <p class="tiny" style="margin-top:20px;line-height:1.8">
      SAME LOGIN AS YOUR BILLING APP.<br>PATIENT RECORDS ARE VISIBLE TO THIS ACCOUNT ONLY.
    </p>
  </div>
</div>

<div id="app" class="hide">
  <header class="top">
    <div>
      <div class="wordmark">AURAA</div>
      <div class="name" style="font-size:15px;margin-top:3px">Derma-Intelligence</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="signout">Sign out</button>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <button data-tab="patients" class="on"><span class="g">&#128101;</span>Patients</button>
    <button data-tab="new"><span class="g">&#43;</span>New</button>
    <button data-tab="reports"><span class="g">&#128203;</span>Reports</button>
    <button data-tab="settings"><span class="g">&#9881;</span>Settings</button>
  </nav>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ===================================================================
   CONNECTION
   This is a "publishable" key. It is designed to sit in the page and
   grants nothing by itself — every table is protected by the login
   rules created in Step 1. No secret key is ever placed in this file.
   =================================================================== */
const SUPABASE_URL = "https://pcmmldqcfbslnrmgpoez.supabase.co";
const SUPABASE_KEY = "sb_publishable_ukrht_UV0BRZB_CJ92ocWg_ZfO3wTV_";
const ADMIN_EMAIL  = "auraa.skincare@gmail.com";
const BUCKET       = "derma-photos";

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===================================================================
   HELPERS
   =================================================================== */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { try { return new Date(d).toLocaleDateString("en-GB",
  {day:"numeric",month:"short",year:"numeric"}); } catch(e){ return d; } };
const num = v => (v === "" || v == null) ? null : (isFinite(Number(v)) ? Number(v) : null);

let toastTimer = null;
function toast(msg, ms=2800){
  let t = $("#toast");
  if(!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), ms);
}
function fail(e){
  console.error(e);
  toast(e && e.message ? "Problem: " + e.message : "Something went wrong.", 5000);
}

/* ===================================================================
   WHAT THE REPORT MEASURES
   ai    = measured by the engine. LOCKED, never editable.
   you   = your clinical grade. Editable.
   meas  = a scalp measurement you take yourself.
   =================================================================== */
const SKIN_AI = [
  { k:"pigment",       label:"Pigment level",        unit:"/100" },
  { k:"pigmentUneven", label:"Pigment unevenness",   unit:"/100" },
  { k:"redness",       label:"Redness / erythema",   unit:"/100" },
  { k:"rednessUneven", label:"Redness unevenness",   unit:"/100" },
  { k:"oiliness",      label:"Shine / oil",          unit:"/100" },
  { k:"texture",       label:"Texture irregularity", unit:"/100" },
  { k:"pores",         label:"Pore visibility",      unit:"/100" },
  { k:"blemishes",     label:"Blemish load",         unit:"/100" },
  { k:"hydration",     label:"Dryness appearance",   unit:"/100" }
];
const SKIN_YOU = [
  { k:"fitzpatrick", label:"Fitzpatrick type",         opts:["","I","II","III","IV","V","VI"] },
  { k:"glogau",      label:"Glogau photoageing",       opts:["","I","II","III","IV"] },
  { k:"mmasi",       label:"Melasma severity (mMASI)", num:true, hint:"0–24" },
  { k:"melasmaType", label:"Melasma pattern",          opts:["","Epidermal","Dermal","Mixed","Not applicable"] },
  { k:"acneIGA",     label:"Acne severity (IGA)",      opts:["","0 — clear","1 — almost clear","2 — mild","3 — moderate","4 — severe"] },
  { k:"darkCircle",  label:"Dark circle grade",        opts:["","0","I","II","III"] }
];
const HAIR_MEAS = [
  { k:"density", label:"Hair density",         unit:"/cm²" },
  { k:"shaft",   label:"Mean shaft thickness", unit:"µm" },
  { k:"mini",    label:"Miniaturisation",      unit:"%" },
  { k:"tv",      label:"Terminal : vellus",    unit:"ratio" }
];
const HAIR_YOU = [
  { k:"norwood", label:"Norwood scale (male)",  opts:["","Not applicable","I","II","III","IV","V","VI","VII"] },
  { k:"ludwig",  label:"Ludwig scale (female)", opts:["","Not applicable","I","II","III"] }
];

/* ===================================================================
   SIGN IN
   =================================================================== */
$("#signin").onclick = async () => {
  const email = $("#email").value.trim(), password = $("#pass").value;
  if(!email || !password){ $("#gateMsg").textContent = "Enter your email and password."; return; }
  $("#signin").disabled = true; $("#signin").textContent = "Signing in…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $("#signin").disabled = false; $("#signin").textContent = "Sign in";
  if(error){ $("#gateMsg").textContent = "That did not work: " + error.message; return; }
  await checkSession();
};
$("#pass").addEventListener("keydown", e => { if(e.key === "Enter") $("#signin").click(); });
$("#signout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function checkSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("#gate").classList.remove("hide"); $("#app").classList.add("hide"); return; }
  if(session.user.email !== ADMIN_EMAIL){
    await sb.auth.signOut();
    $("#gateMsg").textContent = "That account cannot open patient records. Clinical data is restricted to the clinic admin account.";
    return;
  }
  $("#gate").classList.add("hide");
  $("#app").classList.remove("hide");
  go("patients");
}

/* ===================================================================
   NAVIGATION
   =================================================================== */
let TAB = "patients", CTX = {}, searchQ = "";
$$("nav.tabs button").forEach(b => b.onclick = () => go(b.dataset.tab));

function go(tab, ctx={}){
  TAB = tab; CTX = ctx;
  $$("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  render();
}
async function render(){
  const v = $("#view");
  v.innerHTML = `<div class="sub">Loading…</div>`;
  try {
    if(TAB === "patients")      v.innerHTML = await viewPatients();
    else if(TAB === "patient")  v.innerHTML = await viewPatient(CTX.id);
    else if(TAB === "edit")     v.innerHTML = await viewEdit(CTX.id);
    else if(TAB === "new")      v.innerHTML = await viewEdit(null);
    else if(TAB === "reports")  v.innerHTML = await viewReports();
    else if(TAB === "report")   v.innerHTML = await viewReport(CTX.id);
    else if(TAB === "settings") v.innerHTML = await viewSettings();
    window.scrollTo(0,0);
    await wireUp();
  } catch(err){
    v.innerHTML = `<div class="banner bad">Could not load: ${esc(err.message)}</div>`;
  }
}

/* ===================================================================
   PATIENT LIST
   =================================================================== */
async function viewPatients(){
  let q = sb.from("di_patients").select("*").order("updated_at", { ascending:false }).limit(300);
  if(searchQ){
    const s = searchQ.replace(/[%,()]/g,"");
    q = q.or(`name.ilike.%${s}%,mrn.ilike.%${s}%,phone.ilike.%${s}%,skin_concerns.ilike.%${s}%,hair_concerns.ilike.%${s}%`);
  }
  const { data, error } = await q;
  if(error) throw error;
  return `
  <div class="eyebrow">Patient records</div>
  <h2 class="disp">Your patients</h2>
  <p class="sub" style="margin:6px 0 14px">${data.length} shown. The same records on your phone, laptop and tablet.</p>
  <input class="in" id="q" placeholder="Search name, ID, phone, or concern…" value="${esc(searchQ)}" style="margin-bottom:14px">
  ${data.length ? data.map(p => `
    <button class="card tap" data-open="${p.id}">
      <span class="avatar">${esc((p.name||"?").trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase())}</span>
      <span style="flex:1;min-width:0">
        <span style="display:block;font-size:15px">${esc(p.name)}</span>
        <span class="tiny" style="display:block;margin-top:3px">${esc(p.mrn||"no ID")}${p.age?" · "+p.age:""}${esc(p.sex||"")}${p.fitzpatrick?" · FST "+esc(p.fitzpatrick):""}</span>
        <span style="display:block;font-size:12px;color:var(--muted);margin-top:4px">${esc(p.skin_concerns||p.hair_concerns||"—")}</span>
      </span>
      ${p.allergies ? `<span class="chip bad">ALLERGY</span>` : ""}
    </button>`).join("")
    : `<div class="card"><p class="sub" style="margin:0">${searchQ ? "Nothing matched that search." : "No patients yet. Tap <b style=\"color:var(--rose)\">New</b> below."}</p></div>`}
  `;
}

/* ===================================================================
   ADD / EDIT PATIENT
   =================================================================== */
const P_FIELDS = [
  ["name","Full name","text"], ["mrn","Clinic ID / MRN","text"],
  ["age","Age","number"], ["sex","Sex","select:,F,M,Other"],
  ["phone","Phone","tel"], ["fitzpatrick","Fitzpatrick type","select:,I,II,III,IV,V,VI"],
  ["skin_concerns","Skin concerns","area"], ["hair_concerns","Hair / scalp concerns","area"],
  ["allergies","Allergies  ⚠ shown as a warning flag","area"],
  ["medications","Current medications","area"],
  ["med_history","Medical history","area"],
  ["treatment_history","Past treatments","area"],
  ["menstrual","Menstrual / hormonal history","area"],
  ["routine","Current skincare routine","area"],
  ["lifestyle","Lifestyle notes (sun, smoking, diet)","area"],
  ["stress","Stress score (0–10)","number"], ["sleep","Sleep score (0–10)","number"],
  ["labs","Lab results","area"]
];
const NUMERIC = ["age","stress","sleep"];

function fieldHTML(f, val){
  const [k, label, type] = f;
  if(type === "area")
    return `<label class="fld"><span>${esc(label)}</span><textarea class="in" data-f="${k}">${esc(val)}</textarea></label>`;
  if(type.startsWith("select:")){
    const opts = type.slice(7).split(",");
    return `<label class="fld"><span>${esc(label)}</span><select class="in" data-f="${k}">${
      opts.map(o => `<option value="${esc(o)}"${String(val ?? "")===o?" selected":""}>${o||"—"}</option>`).join("")}</select></label>`;
  }
  return `<label class="fld"><span>${esc(label)}</span><input class="in" type="${type}" data-f="${k}" value="${esc(val)}"></label>`;
}
async function viewEdit(id){
  let p = { consent:{} };
  if(id){
    const { data, error } = await sb.from("di_patients").select("*").eq("id", id).single();
    if(error) throw error;
    p = data;
  }
  return `
  <div class="eyebrow">${id ? "Edit record" : "New patient"}</div>
  <h2 class="disp">${id ? esc(p.name) : "Add a patient"}</h2>
  <p class="sub" style="margin:6px 0 16px">Only the name is required. Fill in the rest over time.</p>
  ${P_FIELDS.map(f => fieldHTML(f, p[f[0]] ?? "")).join("")}
  <div class="eyebrow dim" style="margin:18px 0 8px">Consent — each one separate, each one withdrawable</div>
  ${[["care","Care delivery"],["training","Use images to improve the tool"],
     ["research","Research / teaching"],["marketing","Before-and-after marketing"]]
    .map(([k,l]) => `
    <label class="fld" style="display:flex;align-items:center;gap:11px;margin-bottom:9px">
      <input type="checkbox" data-c="${k}" ${p.consent && p.consent[k] ? "checked" : ""}
        style="width:22px;height:22px;accent-color:var(--rose);flex-shrink:0">
      <span style="margin:0;font-size:14px;color:var(--cream)">${l}</span>
    </label>`).join("")}
  <div class="row" style="margin-top:20px">
    <button class="btn solid" id="savePatient" data-id="${id||""}">Save patient</button>
    ${id ? `<button class="btn ghost" data-open="${id}">Cancel</button>`
         : `<button class="btn ghost" data-tab="patients">Cancel</button>`}
  </div>
  ${id ? `<button class="btn danger" id="delPatient" data-id="${id}" style="margin-top:22px">Delete this patient permanently</button>` : ""}
  `;
}

/* ===================================================================
   PATIENT DETAIL
   =================================================================== */
async function viewPatient(id){
  const { data:p, error } = await sb.from("di_patients").select("*").eq("id", id).single();
  if(error) throw error;
  const { data:reps } = await sb.from("di_reports").select("id,report_date,signed,engine")
    .eq("patient_id", id).order("report_date", { ascending:false });
  const line = (l,v) => v ? `
    <div style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div class="tiny">${esc(l).toUpperCase()}</div>
      <div style="font-size:13.5px;margin-top:4px;line-height:1.5">${esc(v)}</div>
    </div>` : "";
  return `
  <button class="btn ghost sm" data-tab="patients" style="margin-bottom:14px">‹ All patients</button>
  <div class="eyebrow">Patient record</div>
  <h2 class="disp">${esc(p.name)}</h2>
  <div class="tiny" style="margin-bottom:14px">${esc(p.mrn||"no ID")}${p.age?" · "+p.age:""}${esc(p.sex||"")}${p.fitzpatrick?" · FST "+esc(p.fitzpatrick):""}</div>
  ${p.allergies ? `<div class="banner bad"><b>Allergy on record:</b> ${esc(p.allergies)}</div>` : ""}
  <div class="row" style="margin-bottom:18px">
    <button class="btn solid" data-newreport="${id}">New analysis</button>

function metricRow(m, val, kind){
  const has = val !== "" && val != null;
  const chip = kind === "ai"   ? `<span class="chip ai">AI MEASURED · LOCKED</span>`
             : kind === "meas" ? `<span class="chip">YOUR MEASUREMENT</span>`
             :                   `<span class="chip you">YOUR GRADE · EDITABLE</span>`;
  if(kind === "ai"){
    const pct = has ? Math.max(0, Math.min(100, Number(val))) : 0;
    return `<div class="metric">
      <div class="mtop">
        <span class="mname">${esc(m.label)}</span>
        <span class="mval locked">${has?esc(val):"—"}<span style="font-size:11px;color:var(--dim)"> ${esc(m.unit||"")}</span></span>
      </div>
      ${has ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}
      <div style="margin-top:5px">${chip}</div>
    </div>`;
  }
  const input = m.opts
    ? `<select class="in" data-m="${kind}:${m.k}" style="margin-top:8px">${
        m.opts.map(o => `<option value="${esc(o)}"${String(val ?? "")===o?" selected":""}>${o||"—"}</option>`).join("")}</select>`
    : `<input class="in" type="${m.num||m.unit?"number":"text"}" step="any" data-m="${kind}:${m.k}"
        value="${esc(val)}" placeholder="${esc(m.hint||m.unit||"")}" style="margin-top:8px">`;
  return `<div class="metric">
    <div class="mtop"><span class="mname">${esc(m.label)}</span>${chip}</div>${input}
  </div>`;
}

/* ===================================================================
   SKIN ANALYSIS — runs on this device, in this browser.
   No server, no upload to anyone, nothing leaves the phone.

   Pigment and blood absorb light differently across red, green and blue.
   That difference is already in an ordinary photo; it is just mixed
   together. These sums pull the two apart.

   Verified against synthetic skin across Fitzpatrick II–VI before use.
   =================================================================== */
const MEL=[0.4143,0.3570,0.8372], HEM=[0.2988,0.6838,0.6657];
const _dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const _sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const _mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const _norm=a=>_mul(a,1/Math.sqrt(_dot(a,a)));
const _E=_norm([1,1,1]);
const _deshade=v=>_sub(v,_mul(_E,_dot(v,_E)));
const _Mp=_deshade(MEL), _Hp=_deshade(HEM);
const _A11=_dot(_Mp,_Mp), _A12=_dot(_Mp,_Hp), _A22=_dot(_Hp,_Hp);
const _DET=_A11*_A22-_A12*_A12;

function unmix(r,g,b){
  const eps=1/255;
  const D=[-Math.log10(Math.max(r/255,eps)),
           -Math.log10(Math.max(g/255,eps)),
           -Math.log10(Math.max(b/255,eps))];
  const Dp=_deshade(D), b1=_dot(Dp,_Mp), b2=_dot(Dp,_Hp);
  return { mel:(_A22*b1-_A12*b2)/_DET, hem:(-_A12*b1+_A11*b2)/_DET };
}

/* Proportions of red/green/blue, not absolute colour — absolute chroma
   collapses on deep skin and throws away Fitzpatrick VI faces entirely. */
function isSkin(r,g,b){
  const sum=r+g+b;
  if(sum<48 || sum>700) return false;
  const rn=r/sum, gn=g/sum, bn=b/sum;
  if(rn<0.385||rn>0.545) return false;
  if(gn<0.275||gn>0.485) return false;
  if(bn>0.31) return false;
  if(r<g || g<b) return false;
  return true;
}

/* The sheet of white paper. Deliberately NOT tested for looking neutral —
   under a warm bulb the paper reads orange, and that cast is precisely the
   measurement we need. */
function findWhiteReference(px,n){
  let clipped=0; const cand=[], allLum=[];
  for(let i=0;i<n;i++){
    const r=px[i*4],g=px[i*4+1],b=px[i*4+2];
    allLum.push(0.299*r+0.587*g+0.114*b);
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    if(mx>=250){ clipped++; continue; }
    if(mx<90) continue;
    if(mx-mn > mx*0.45) continue;
    cand.push([r,g,b,0.299*r+0.587*g+0.114*b]);
  }
  if(clipped > n*0.02)      return { ref:null, clipped:true };
  if(cand.length < n*0.004) return { ref:null, clipped:false };
  cand.sort((p,q)=>q[3]-p[3]);
  const take=cand.slice(0, Math.max(1,Math.floor(cand.length*0.15)));
  const s=take.reduce((a,c)=>[a[0]+c[0],a[1]+c[1],a[2]+c[2]],[0,0,0]);
  const ref=[s[0]/take.length,s[1]/take.length,s[2]/take.length];
  allLum.sort((a,b)=>a-b);
  const mid=allLum[Math.floor(allLum.length/2)];
  if(0.299*ref[0]+0.587*ref[1]+0.114*ref[2] < mid*1.12) return { ref:null, clipped:false };
  return { ref, clipped:false };
}

function analysePixels(px,w,h){
  const total=w*h;
  const wr=findWhiteReference(px,total);
  let gain=[1,1,1];
  if(wr.ref){
    const avg=(wr.ref[0]+wr.ref[1]+wr.ref[2])/3;
    gain=[avg/wr.ref[0], avg/wr.ref[1], avg/wr.ref[2]];
  }
  const mels=[],hems=[],lums=new Float32Array(total).fill(-1);
  let skin=0, dark=0, shine=0;
  const melMap=new Float32Array(total).fill(NaN), hemMap=new Float32Array(total).fill(NaN);

  for(let i=0;i<total;i++){
    let r=px[i*4],g=px[i*4+1],b=px[i*4+2];
    if(!isSkin(r,g,b)) continue;
    skin++;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    if(mx>248 && mx-mn<28){ shine++; continue; }
    r=Math.min(255,r*gain[0]); g=Math.min(255,g*gain[1]); b=Math.min(255,b*gain[2]);
    if(Math.min(r,g,b)<10) dark++;
    const o=unmix(r,g,b);
    mels.push(o.mel); hems.push(o.hem);
    melMap[i]=o.mel; hemMap[i]=o.hem;
    lums[i]=0.299*r+0.587*g+0.114*b;
  }
  if(mels.length < total*0.01)
    return { ok:false, reason:"No skin found. Check the face fills the frame and is lit well enough." };

  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length);};

  // texture: how much brightness varies between a pixel and its neighbour
  let tSum=0,tN=0;
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    const i=y*w+x; if(lums[i]<0) continue;
    const j=i+1, k=i+w;
    if(lums[j]<0||lums[k]<0) continue;
    tSum += Math.abs(lums[i]-lums[j]) + Math.abs(lums[i]-lums[k]); tN+=2;
  }
  const texture = tN ? tSum/tN : 0;
  const sc=(v,lo,hi)=>Math.round(Math.max(0,Math.min(100,((v-lo)/(hi-lo))*100)));

  return {
    ok:true,
    whiteReference: !!wr.ref,
    whiteClipped: wr.clipped,
    skinPercent: Math.round(skin/total*100),
    lowConfidencePercent: Math.round(dark/Math.max(1,mels.length)*100),
    maps: { melMap, hemMap, w, h },
    metrics:{
      pigment:       sc(mean(mels), 0.10, 1.60),
      pigmentUneven: sc(sd(mels),   0.00, 0.35),
      redness:       sc(mean(hems), 0.02, 0.70),
      rednessUneven: sc(sd(hems),   0.00, 0.25),
      oiliness:      Math.round(shine/Math.max(1,skin)*100),
      texture:       sc(texture, 0.5, 12)
    }
  };
}

/* Draw a map as a heatmap the patient can actually see. */
function renderMap(map,w,h,which){
  const vals=[]; for(let i=0;i<map.length;i++) if(!isNaN(map[i])) vals.push(map[i]);
  if(!vals.length) return null;
  vals.sort((a,b)=>a-b);
  const lo=vals[Math.floor(vals.length*0.05)], hi=vals[Math.floor(vals.length*0.95)];
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d"), im=ctx.createImageData(w,h);
  for(let i=0;i<w*h;i++){
    const v=map[i];
    if(isNaN(v)){ im.data[i*4]=250; im.data[i*4+1]=247; im.data[i*4+2]=249; im.data[i*4+3]=255; continue; }
    const t=Math.max(0,Math.min(1,(v-lo)/(hi-lo||1)));
    let r,g,b;
    if(which==="pigment"){ r=255-t*140; g=250-t*200; b=245-t*225; }   // cream -> deep brown
    else                 { r=255-t*20;  g=250-t*215; b=248-t*180; }   // cream -> red
    im.data[i*4]=r; im.data[i*4+1]=g; im.data[i*4+2]=b; im.data[i*4+3]=255;
  }
  ctx.putImageData(im,0,0);
  return c.toDataURL("image/png");
}

async function runAnalysis(reportId, signedUrl){
  const img = new Image();
  img.crossOrigin = "anonymous";
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=()=>rej(new Error("could not read that photo")); img.src=signedUrl; });
  const maxW=700, sc=Math.min(1, maxW/img.width);
  const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  const px=c.getContext("2d").getImageData(0,0,w,h).data;

  const r = analysePixels(px,w,h);
  if(!r.ok) throw new Error(r.reason);

  const { data:rep } = await sb.from("di_reports").select("ai").eq("id", reportId).single();
  const ai = Object.assign({}, rep.ai||{}, r.metrics, {
    _meta:{ whiteReference:r.whiteReference, whiteClipped:r.whiteClipped,
            skinPercent:r.skinPercent, lowConfidencePercent:r.lowConfidencePercent,
            at:new Date().toISOString() }
  });
  await sb.from("di_reports").update({ ai, engine:"in-app photo analysis",
    updated_at:new Date().toISOString() }).eq("id", reportId);
  await addAudit(reportId, "Photo analysed in app");
  return r;
}

/* ===================================================================
   BUTTON WIRING
   =================================================================== */
async function wireUp(){
  const q = $("#q");
  if(q) q.oninput = e => {
    searchQ = e.target.value.trim();
    clearTimeout(q._t); q._t = setTimeout(render, 300);
  };

  // photos are private — fetch a temporary signed link for each
  for(const img of $$("img[data-path]")){
    const { data } = await sb.storage.from(BUCKET).createSignedUrl(img.dataset.path, 3600);
    if(data && data.signedUrl) img.src = data.signedUrl;
  }

  const sp = $("#savePatient");
  if(sp) sp.onclick = async () => {
    const row = {};
    $$("[data-f]").forEach(el => {
      const k = el.dataset.f, v = el.value.trim();
      row[k] = NUMERIC.includes(k) ? num(v) : (v || null);
    });
    if(!row.name){ toast("Please enter a name."); return; }
    row.consent = {};
    $$("[data-c]").forEach(el => row.consent[el.dataset.c] = el.checked);
    row.updated_at = new Date().toISOString();
    sp.disabled = true;
    try {
      let id = sp.dataset.id;
      if(id){
        const { error } = await sb.from("di_patients").update(row).eq("id", id);
        if(error) throw error;
      } else {
        const { data, error } = await sb.from("di_patients").insert(row).select("id").single();
        if(error) throw error;
        id = data.id;
      }
      toast("Saved.");
      go("patient", { id });
    } catch(e){ fail(e); sp.disabled = false; }
  };

  const dp = $("#delPatient");
  if(dp) dp.onclick = async () => {
    if(!confirm("Delete this patient, and every report and photo belonging to them?\n\nThis cannot be undone.")) return;
    try {
      const { data:phs } = await sb.from("di_photos").select("storage_path").eq("patient_id", dp.dataset.id);
      if(phs && phs.length) await sb.storage.from(BUCKET).remove(phs.map(x => x.storage_path));
      const { error } = await sb.from("di_patients").delete().eq("id", dp.dataset.id);
      if(error) throw error;
      toast("Deleted."); go("patients");
    } catch(e){ fail(e); }
  };

  const pi = $("#photoIn");
  if(pi) pi.onchange = async e => {
    const files = Array.from(e.target.files); if(!files.length) return;
    toast("Uploading…", 9000);
    try {
      const { data:r } = await sb.from("di_reports").select("id,patient_id").eq("id", CTX.id).single();
      for(const f of files){
        const blob = await shrink(f);
        const path = `${r.patient_id}/${r.id}/${crypto.randomUUID()}.jpg`;
        const { error:upErr } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:"image/jpeg" });
        if(upErr) throw upErr;
        const { error:rowErr } = await sb.from("di_photos")
          .insert({ report_id:r.id, patient_id:r.patient_id, storage_path:path });
        if(rowErr) throw rowErr;
      }
      await addAudit(CTX.id, files.length + " photo(s) added");
      toast("Photos saved."); render();
    } catch(err){ fail(err); }
  };

  $$("[data-delphoto]").forEach(b => b.onclick = async () => {
    if(!confirm("Remove this photo?")) return;
    try {
      await sb.storage.from(BUCKET).remove([b.dataset.path]);
      await sb.from("di_photos").delete().eq("id", b.dataset.delphoto);
      await addAudit(CTX.id, "Photo removed");
      render();
    } catch(e){ fail(e); }
  });

  $$("[data-analyse]").forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = "Analysing…";
    try {
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(b.dataset.analyse, 600);
      if(error) throw error;
      const res = await runAnalysis(CTX.id, data.signedUrl);
      // show the two maps immediately, before the page reloads
      const box = $("#overlayBox");
      if(box && res.maps){
        const p = renderMap(res.maps.melMap, res.maps.w, res.maps.h, "pigment");
        const q = renderMap(res.maps.hemMap, res.maps.w, res.maps.h, "redness");
        box.innerHTML = `
          <div class="eyebrow dim" style="margin:22px 0 8px">Pigment map &amp; redness map</div>
          <div class="row" style="gap:9px">
            <div style="flex:1;min-width:150px">
              <img src="${p}" style="width:100%;border:1px solid var(--line);border-radius:6px">
              <div class="tiny" style="margin-top:5px">PIGMENT — DARKER MEANS MORE</div></div>
            <div style="flex:1;min-width:150px">
              <img src="${q}" style="width:100%;border:1px solid var(--line);border-radius:6px">
              <div class="tiny" style="margin-top:5px">REDNESS — DEEPER MEANS MORE</div></div>
          </div>
          <p class="sub" style="margin-top:9px">The same photo, with pigment and blood separated.
             This is what lets you tell melasma from post-inflammatory redness.</p>`;
        box.scrollIntoView({ behavior:"smooth", block:"start" });
      }
      toast("Analysed. Measurements locked in.");
      setTimeout(render, 2500);
    } catch(e){ fail(e); b.disabled=false; b.textContent="Analyse"; }
  });

  const aj = $("#applyJson");
  if(aj) aj.onclick = async () => {
    const raw = $("#pasteJson").value.trim();
    if(!raw){ toast("Paste the engine's result first."); return; }
    let obj;
    try { obj = JSON.parse(raw); }
    catch(e){ toast("That is not a valid result. Copy the whole thing including the curly brackets."); return; }
    const s = obj.scores || obj, aiNew = {};
    let n = 0;
    SKIN_AI.forEach(m => {
      let v = s[m.k]; if(v == null) return;
      v = Number(v); if(!isFinite(v)) return;
      aiNew[m.k] = Math.round(v <= 1 ? v * 100 : v); n++;
    });
    if(!n){ toast("No matching measurements found in that text."); return; }
    try {
      await sb.from("di_reports").update({ ai:aiNew, engine:"skin-scan (pasted)",
        updated_at:new Date().toISOString() }).eq("id", CTX.id);
      await addAudit(CTX.id, n + " AI measurements imported");
      toast(n + " measurements locked in."); render();
    } catch(e){ fail(e); }
  };

  const ma = $("#manualAi");
  if(ma) ma.onclick = async () => {
    const { data:r } = await sb.from("di_reports").select("ai").eq("id", CTX.id).single();
    const aiNew = Object.assign({}, r.ai || {});
    for(const m of SKIN_AI){
      const v = prompt(m.label + " (0–100). Leave blank to skip.", aiNew[m.k] ?? "");
      if(v === null) break;
      if(v.trim() === "") continue;
      const n = Number(v); if(isFinite(n)) aiNew[m.k] = Math.round(n);
    }
    try {
      await sb.from("di_reports").update({ ai:aiNew, engine:"entered by clinician",
        updated_at:new Date().toISOString() }).eq("id", CTX.id);
      await addAudit(CTX.id, "Measurements entered manually");
      render();
    } catch(e){ fail(e); }
  };

  // editable fields save when you move away from them
  $$("[data-m]").forEach(el => el.onchange = async () => {
    const parts = el.dataset.m.split(":"), kind = parts[0], key = parts[1];
    try {
      const { data:r } = await sb.from("di_reports").select("grades,hair,hair_grades").eq("id", CTX.id).single();
      const patch = { updated_at:new Date().toISOString() };
      if(kind === "note")          patch.note        = el.value;
      else if(kind === "you")      patch.grades      = Object.assign({}, r.grades||{},      { [key]: el.value });
      else if(kind === "meas")     patch.hair        = Object.assign({}, r.hair||{},        { [key]: el.value });
      else if(kind === "hairYou")  patch.hair_grades = Object.assign({}, r.hair_grades||{}, { [key]: el.value });
      const { error } = await sb.from("di_reports").update(patch).eq("id", CTX.id);
      if(error) throw error;
      await addAudit(CTX.id, "Edited " + key);
    } catch(e){ fail(e); }
  });

  $$("[data-trust]").forEach(b => b.onclick = async () => {
    try {
      await sb.from("di_reports").update({ trust:b.dataset.trust,
        updated_at:new Date().toISOString() }).eq("id", CTX.id);
      await addAudit(CTX.id, "Trust set to " + b.dataset.trust);
      render();
    } catch(e){ fail(e); }
  });

  const so = $("#signOff");
  if(so) so.onclick = async () => {
    if(!confirm("Sign off this report?\n\nIt will be locked and cannot be edited afterwards.")) return;
    try {
      const { error } = await sb.from("di_reports").update({ signed:true,
        signed_at:new Date().toISOString(), updated_at:new Date().toISOString() }).eq("id", so.dataset.id);
      if(error) throw error;
      await addAudit(so.dataset.id, "Signed off by clinician");
      toast("Signed off and locked."); render();
    } catch(e){ fail(e); }
  };

  const dr = $("#delReport");
  if(dr) dr.onclick = async () => {
    if(!confirm("Delete this draft report and its photos?\n\nThis cannot be undone.")) return;
    try {
      const { data:phs } = await sb.from("di_photos").select("storage_path").eq("report_id", dr.dataset.id);
      if(phs && phs.length) await sb.storage.from(BUCKET).remove(phs.map(x => x.storage_path));
      await sb.from("di_reports").delete().eq("id", dr.dataset.id);
      toast("Draft deleted."); go("patient", { id: dr.dataset.pid });
    } catch(e){ fail(e); }
  };

  const pb = $("#printBtn");
  if(pb) pb.onclick = () => window.print();

  const ex = $("#exportAll");
  if(ex) ex.onclick = async () => {
    try {
      const { data:pats } = await sb.from("di_patients").select("*");
      const { data:reps } = await sb.from("di_reports").select("*");
      const blob = new Blob([JSON.stringify({ exported:new Date().toISOString(),
        patients:pats, reports:reps }, null, 2)], { type:"application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "auraa-derma-" + today() + ".json";
      a.click();
      toast("Downloaded. Keep it private.");
    } catch(e){ fail(e); }
  };
}

async function addAudit(reportId, what){
  const { data:r } = await sb.from("di_reports").select("audit").eq("id", reportId).single();
  const audit = ((r && r.audit) || []).concat([{ at:new Date().toISOString(), what }]);
  await sb.from("di_reports").update({ audit }).eq("id", reportId);
}

/* shrink the photo in the browser before uploading — keeps it around 150 KB */
function shrink(file, max=1600, q=0.85){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("could not read that image")), "image/jpeg", q);
    };
    img.onerror = () => rej(new Error("could not read that image"));
    img.src = URL.createObjectURL(file);
  });
}

/* one handler for every navigation button */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-open],[data-edit],[data-tab],[data-report],[data-newreport]");
  if(!t) return;
  if(t.dataset.open)        go("patient", { id:t.dataset.open });
  else if(t.dataset.edit)   go("edit",    { id:t.dataset.edit });
  else if(t.dataset.tab)    go(t.dataset.tab);
  else if(t.dataset.report) go("report",  { id:t.dataset.report });
  else if(t.dataset.newreport){
    try {
      const { data, error } = await sb.from("di_reports")
        .insert({ patient_id:t.dataset.newreport,
                  audit:[{ at:new Date().toISOString(), what:"Report created" }] })
        .select("id").single();
      if(error) throw error;
      go("report", { id:data.id });
    } catch(err){ fail(err); }
  }
});
