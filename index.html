<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Derma-Intelligence">
<meta name="theme-color" content="#FFFFFF">
<title>Auraa · Derma-Intelligence</title>
<style>
:root{
  /* Auraa brand. Magenta and black on white, taken from the clinic logo.
     Near-white page so skin tone in photos is judged accurately. */
  --ground:#FAF7F9; --panel:#FFFFFF; --panelHi:#F7F2F5; --line:#E8E2E5;
  --rose:#E5007D;        /* Auraa magenta */
  --roseDeep:#C40065;    /* darker magenta, for small text */
  --gold:#8A6F14; --cream:#1A1A1A; --muted:#6B6266; --dim:#7C737A;
  --ok:#2F7D5F; --warn:#9C6410; --bad:#B3453F; --info:#3E6A97;
  --mono:'SF Mono','Roboto Mono',Menlo,ui-monospace,monospace;
  --display:'Iowan Old Style','Palatino Linotype',Georgia,serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ground);color:var(--cream);font-family:var(--body);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
.hide{display:none!important}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--roseDeep);text-transform:uppercase}
.eyebrow.dim{color:var(--dim)}
/* brand lockup, matching the clinic logo */
.wordmark{font-family:var(--display);color:var(--rose);letter-spacing:.20em;
  font-size:19px;line-height:1;font-weight:400}
.wordmark.big{font-size:40px;letter-spacing:.22em}
.services{font-family:var(--display);color:var(--cream);letter-spacing:.10em;
  font-size:9.5px;margin-top:7px;line-height:1}
.services.big{font-size:12px;margin-top:11px}
h2.disp{font-family:var(--display);font-size:24px;font-weight:400;margin:6px 0 4px}
.mono{font-family:var(--mono)}
.sub{color:var(--muted);font-size:13px;line-height:1.55}
.tiny{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .name{font-family:var(--display);font-size:17px}
header.top .spacer{flex:1}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;
  min-width:44px;height:36px;font-size:12px;padding:0 10px}
main{padding:16px 16px 24px;max-width:820px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:transparent;border:none;color:var(--dim);padding:10px 4px 12px;
  font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
nav.tabs button .g{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--rose)}
.btn{background:transparent;border:1px solid var(--rose);color:var(--cream);border-radius:6px;
  padding:12px 16px;font-size:14px;min-height:46px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;width:100%}
.btn.solid{background:var(--rose);color:#FFFFFF;font-weight:600;border-color:var(--rose)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{width:auto;padding:9px 14px;min-height:40px;font-size:13px}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{width:auto;flex:1;min-width:130px}
label.fld{display:block;margin-bottom:12px}
label.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input.in,select.in,textarea.in{width:100%;padding:12px;background:var(--panelHi);
  border:1px solid var(--line);color:var(--cream);border-radius:6px;min-height:46px}
textarea.in{min-height:76px;resize:vertical;line-height:1.5}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--rose)}
.chip{font-family:var(--mono);font-size:9px;padding:3px 7px;border-radius:3px;
  border:1px solid var(--line);color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.chip.ai{border-color:var(--info);color:var(--info)}
.chip.you{border-color:var(--gold);color:var(--gold)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:13px;margin-bottom:9px;
  box-shadow:0 1px 2px rgba(42,32,35,.05)}
.card.tap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--cream)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--line);color:var(--rose);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;flex-shrink:0}
.banner{padding:11px 13px;border-radius:6px;background:var(--panel);border-left:3px solid var(--warn);
  font-size:12.5px;line-height:1.55;margin-bottom:9px;color:var(--cream)}
.banner.bad{border-left-color:var(--bad)}
.banner.ok{border-left-color:var(--ok)}
.banner.info{border-left-color:var(--info)}
.metric{border-bottom:1px solid var(--line);padding:12px 0}
.metric:last-child{border-bottom:none}
.metric .mtop{display:flex;align-items:center;gap:8px;justify-content:space-between}
.metric .mname{font-size:14px}
.metric .mval{font-family:var(--mono);font-size:19px}
.metric .mval.locked{color:var(--info)}
.bar{height:5px;background:var(--panelHi);border-radius:3px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--info);border-radius:3px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:var(--panelHi)}
.thumbwrap{position:relative}
.thumbwrap button.del{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.94);border:1px solid var(--line);
  color:var(--bad);border-radius:4px;width:26px;height:26px;font-size:13px;line-height:1;padding:0;
  box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pill{padding:8px 13px;border-radius:20px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  background:transparent;border:1px solid var(--line);color:var(--muted);min-height:38px}
.pill.on{background:var(--rose);color:#FFFFFF;border-color:var(--rose)}
.gate{position:fixed;inset:0;z-index:100;background:var(--ground);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:28px;text-align:center}
.gate .box{width:100%;max-width:340px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:200;
  background:#FFFFFF;border:1px solid var(--rose);border-radius:8px;padding:13px 15px;
  font-size:13.5px;line-height:1.45;box-shadow:0 6px 20px rgba(42,32,35,.16)}
footer.legal{padding:20px 16px calc(20px + env(safe-area-inset-bottom));text-align:center}

/* ---------- the patient handout ---------- */
#handout{background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px 24px;
  max-width:780px;margin:0 auto;color:#1A1A1A}
.hHead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  border-bottom:2px solid var(--rose);padding-bottom:13px;flex-wrap:wrap}
#handout h3{font-family:var(--display);font-size:16px;font-weight:400;margin:24px 0 9px;
  color:var(--roseDeep);border-bottom:1px solid var(--line);padding-bottom:5px}
table.ht{width:100%;border-collapse:collapse;font-size:13px}
table.ht th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  color:var(--muted);text-transform:uppercase;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
table.ht td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
.hGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.hGrid figure{margin:0}
.hGrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line);
  border-radius:5px;display:block;background:var(--panelHi)}
.hGrid figcaption{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--muted);
  margin-top:5px;text-transform:uppercase;line-height:1.4}
.pGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.pGrid figure{margin:0}
.pGrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line);
  border-radius:6px;display:block;background:var(--panelHi)}
.pGrid figcaption{margin-top:6px;font-size:11.5px;line-height:1.45}
.pGrid figcaption b{display:block;font-size:12.5px;color:#1A1A1A;margin-bottom:2px}
.pGrid figcaption span{color:var(--muted);font-size:10.5px;line-height:1.4;display:block}
/* ---------- report layout ---------- */
.rHead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#1A1A1A;
  margin:-26px -24px 0;padding:20px 24px;border-radius:8px 8px 0 0}
.rDate{border:1px solid #4A3A42;border-radius:6px;padding:8px 12px;text-align:center}
.rTop{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-top:16px}
.rBox{border:1px solid var(--line);border-radius:7px;padding:12px;background:#fff}
.rCentre{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rLbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--muted);
  text-transform:uppercase;margin-bottom:8px}
table.ht.mini td{padding:5px 6px 5px 0;font-size:12px}
.rSection{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:#fff;background:var(--roseDeep);
  padding:7px 12px;border-radius:5px;margin:22px 0 11px;text-transform:uppercase}
.rDials{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px}
.rDial{text-align:center;border:1px solid var(--line);border-radius:7px;padding:10px 5px}
.rdName{font-size:10.5px;margin-top:5px;line-height:1.3}
.rdBand{font-size:9.5px;margin-top:2px}
.estTag{display:inline-block;font-family:var(--mono);font-size:7.5px;letter-spacing:.09em;
  border:1px solid var(--gold);color:var(--gold);border-radius:3px;padding:1px 4px;margin-top:4px}
.rCols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.rConc{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rSev{font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;border:1px solid;
  border-radius:3px;padding:3px 7px;white-space:nowrap}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:18px 0 4px;
  background:var(--panelHi);border:1px solid var(--line);border-radius:8px;padding:16px}
.hero .heroRing{width:118px;height:118px;flex-shrink:0}
.hero>div{flex:1;min-width:190px}
.dials{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;margin-top:4px}
.dial{text-align:center}
.dial .ring{width:100%;max-width:76px;height:auto}
.dial .dv{font-family:var(--mono);font-size:26px;line-height:1.1;color:var(--roseDeep);padding-top:8px}
.dial .dv span{font-size:13px}
.dial .dl{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.35}
.dial .db{font-size:10.5px;margin-top:2px}
.fine{font-size:11px;color:var(--muted);line-height:1.55;margin:6px 0 0}
.hp{font-size:13px;line-height:1.6;margin:0}
.hSug{border-left:2px solid var(--rose);padding:8px 0 8px 11px;margin-bottom:9px;font-size:13px;line-height:1.5}
.hFoot{margin-top:26px;padding-top:13px;border-top:1px solid var(--line);font-size:11.5px;
  line-height:1.6;color:var(--muted)}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000;padding:0}
  header.top,nav.tabs,.noprint{display:none!important}
  main{padding:0;max-width:none}
  .card{background:#fff;border:1px solid #999;color:#000}
  .metric .mval,.metric .mval.locked{color:#000}
  .sub,.tiny{color:#333}
  #handout{border:none;border-radius:0;padding:0;max-width:none}
  #handout h3{break-after:avoid}
  table.ht tr,.hGrid figure,.pGrid figure,.hSug,.dial,.rDial,.rBox{break-inside:avoid}
  .pGrid{grid-template-columns:repeat(4,1fr)}
  .dials{grid-template-columns:repeat(6,1fr)}
  .rDials{grid-template-columns:repeat(10,1fr)}
  .rTop{grid-template-columns:repeat(4,1fr)}
  .rHead{margin:0 0 4px;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rSection{-webkit-print-color-adjust:exact;print-color-adjust:exact;break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hFoot{break-inside:avoid}
  a{text-decoration:none;color:#000}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <div class="wordmark big">AURAA</div>
    <div class="services big">SLIMMING &nbsp;|&nbsp; HAIR &nbsp;|&nbsp; SKIN &nbsp;|&nbsp; LASER</div>
    <div style="height:1px;background:var(--line);margin:20px 0 16px"></div>
    <div style="font-family:var(--display);font-size:23px">Derma-Intelligence</div>
    <p class="sub" id="gateMsg" style="margin:12px 0 18px">Sign in with your clinic email.</p>
    <label class="fld"><span>Email</span><input class="in" id="email" type="email" autocomplete="username" value="auraa.skincare@gmail.com"></label>
    <label class="fld"><span>Password</span><input class="in" id="pass" type="password" autocomplete="current-password"></label>
    <button class="btn solid" id="signin">Sign in</button>
    <p class="tiny" style="margin-top:20px;line-height:1.8">
      SAME LOGIN AS YOUR BILLING APP.<br>PATIENT RECORDS ARE VISIBLE TO THIS ACCOUNT ONLY.
    </p>
  </div>
</div>

<div id="app" class="hide">
  <header class="top">
    <div>
      <div class="wordmark">AURAA</div>
      <div class="name" style="font-size:15px;margin-top:3px">Derma-Intelligence</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="signout">Sign out</button>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <button data-tab="patients" class="on"><span class="g">&#128101;</span>Patients</button>
    <button data-tab="new"><span class="g">&#43;</span>New</button>
    <button data-tab="reports"><span class="g">&#128203;</span>Reports</button>
    <button data-tab="settings"><span class="g">&#9881;</span>Settings</button>
  </nav>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ===================================================================
   CONNECTION
   This is a "publishable" key. It is designed to sit in the page and
   grants nothing by itself — every table is protected by the login
   rules created in Step 1. No secret key is ever placed in this file.
   =================================================================== */
const SUPABASE_URL = "https://pcmmldqcfbslnrmgpoez.supabase.co";
const SUPABASE_KEY = "sb_publishable_ukrht_UV0BRZB_CJ92ocWg_ZfO3wTV_";
const ADMIN_EMAIL  = "auraa.skincare@gmail.com";
const BUCKET       = "derma-photos";

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===================================================================
   HELPERS
   =================================================================== */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { try { return new Date(d).toLocaleDateString("en-GB",
  {day:"numeric",month:"short",year:"numeric"}); } catch(e){ return d; } };
const num = v => (v === "" || v == null) ? null : (isFinite(Number(v)) ? Number(v) : null);

let toastTimer = null;
function toast(msg, ms=2800){
  let t = $("#toast");
  if(!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), ms);
}
function fail(e){
  console.error(e);
  toast(e && e.message ? "Problem: " + e.message : "Something went wrong.", 5000);
}

/* ===================================================================
   WHAT THE REPORT MEASURES
   ai    = measured by the engine. LOCKED, never editable.
   you   = your clinical grade. Editable.
   meas  = a scalp measurement you take yourself.
   =================================================================== */
const SKIN_AI = [
  { k:"healthScore",   label:"Overall Skin Health",  unit:"/100" },
  { k:"pigment",       label:"Pigment level",        unit:"/100" },
  { k:"wrinkles",      label:"Wrinkles",             unit:"/100" },
  { k:"pigmentUneven", label:"Pigment unevenness",   unit:"/100" },
  { k:"redness",       label:"Redness / erythema",   unit:"/100" },
  { k:"rednessUneven", label:"Redness unevenness",   unit:"/100" },
  { k:"oiliness",      label:"Shine / oil",          unit:"/100" },
  { k:"texture",       label:"Texture irregularity", unit:"/100" },
  { k:"pores",         label:"Pore visibility",      unit:"/100" },
  { k:"blemishes",     label:"Blemish load",         unit:"/100" },
  { k:"hydration",     label:"Dryness appearance",   unit:"/100" }
];
const SKIN_YOU = [
  { k:"fitzpatrick", label:"Fitzpatrick type",         opts:["","I","II","III","IV","V","VI"] },
  { k:"glogau",      label:"Glogau photoageing",       opts:["","I","II","III","IV"] },
  { k:"mmasi",       label:"Melasma severity (mMASI)", num:true, hint:"0–24" },
  { k:"melasmaType", label:"Melasma pattern",          opts:["","Epidermal","Dermal","Mixed","Not applicable"] },
  { k:"acneIGA",     label:"Acne severity (IGA)",      opts:["","0 — clear","1 — almost clear","2 — mild","3 — moderate","4 — severe"] },
  { k:"darkCircle",  label:"Dark circle grade",        opts:["","0","I","II","III"] }
];
const HAIR_MEAS = [
  { k:"density", label:"Hair density",         unit:"/cm²" },
  { k:"shaft",   label:"Mean shaft thickness", unit:"µm" },
  { k:"mini",    label:"Miniaturisation",      unit:"%" },
  { k:"tv",      label:"Terminal : vellus",    unit:"ratio" }
];
const HAIR_YOU = [
  { k:"norwood", label:"Norwood scale (male)",  opts:["","Not applicable","I","II","III","IV","V","VI","VII"] },
  { k:"ludwig",  label:"Ludwig scale (female)", opts:["","Not applicable","I","II","III"] }
];

/* ===================================================================
   SIGN IN
   =================================================================== */
$("#signin").onclick = async () => {
  const email = $("#email").value.trim(), password = $("#pass").value;
  if(!email || !password){ $("#gateMsg").textContent = "Enter your email and password."; return; }
  $("#signin").disabled = true; $("#signin").textContent = "Signing in…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $("#signin").disabled = false; $("#signin").textContent = "Sign in";
  if(error){ $("#gateMsg").textContent = "That did not work: " + error.message; return; }
  await checkSession();
};
$("#pass").addEventListener("keydown", e => { if(e.key === "Enter") $("#signin").click(); });
$("#signout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function checkSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("#gate").classList.remove("hide"); $("#app").classList.add("hide"); return; }
  if(session.user.email !== ADMIN_EMAIL){
    await sb.auth.signOut();
    $("#gateMsg").textContent = "That account cannot open patient records. Clinical data is restricted to the clinic admin account.";
    return;
  }
  $("#gate").classList.add("hide");
  $("#app").classList.remove("hide");
  go("patients");
}

/* ===================================================================
   NAVIGATION
   =================================================================== */
let TAB = "patients", CTX = {}, searchQ = "";
$$("nav.tabs button").forEach(b => b.onclick = () => go(b.dataset.tab));

function go(tab, ctx={}){
  TAB = tab; CTX = ctx;
  $$("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  render();
}
async function render(){
  const v = $("#view");
  v.innerHTML = `<div class="sub">Loading…</div>`;
  try {
    if(TAB === "patients")      v.innerHTML = await viewPatients();
    else if(TAB === "patient")  v.innerHTML = await viewPatient(CTX.id);
    else if(TAB === "edit")     v.innerHTML = await viewEdit(CTX.id);
    else if(TAB === "new")      v.innerHTML = await viewEdit(null);
    else if(TAB === "reports")  v.innerHTML = await viewReports();
    else if(TAB === "report")   v.innerHTML = await viewReport(CTX.id);
    else if(TAB === "handout")  v.innerHTML = await viewHandout(CTX.id);
    else if(TAB === "settings") v.innerHTML = await viewSettings();
    window.scrollTo(0,0);
    await wireUp();

function fieldHTML(f, val){
  const [k, label, type] = f;
  if(type === "area")
    return `<label class="fld"><span>${esc(label)}</span><textarea class="in" data-f="${k}">${esc(val)}</textarea></label>`;
  if(type.startsWith("select:")){
    const opts = type.slice(7).split(",");
    return `<label class="fld"><span>${esc(label)}</span><select class="in" data-f="${k}">${
      opts.map(o => `<option value="${esc(o)}"${String(val ?? "")===o?" selected":""}>${o||"—"}</option>`).join("")}</select></label>`;
  }
  return `<label class="fld"><span>${esc(label)}</span><input class="in" type="${type}" data-f="${k}" value="${esc(val)}"></label>`;
}

   THE ANALYSIS REPORT
   =================================================================== */
function metricRow(m, val, kind){
  const has = val !== "" && val != null;
  const chip = kind === "ai"   ? `<span class="chip ai">AI MEASURED · LOCKED</span>`
             : kind === "meas" ? `<span class="chip">YOUR MEASUREMENT</span>`
             :                   `<span class="chip you">YOUR GRADE · EDITABLE</span>`;
  if(kind === "ai"){
    const pct = has ? Math.max(0, Math.min(100, Number(val))) : 0;
    return `<div class="metric">
      <div class="mtop">
        <span class="mname">${esc(m.label)}</span>
        <span class="mval locked">${has?esc(val):"—"}<span style="font-size:11px;color:var(--dim)"> ${esc(m.unit||"")}</span></span>
      </div>
      ${has ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}
      <div style="margin-top:5px">${chip}</div>
    </div>`;
  }
  const input = m.opts
    ? `<select class="in" data-m="${kind}:${m.k}" style="margin-top:8px">${
        m.opts.map(o => `<option value="${esc(o)}"${String(val ?? "")===o?" selected":""}>${o||"—"}</option>`).join("")}</select>`
    : `<input class="in" type="${m.num||m.unit?"number":"text"}" step="any" data-m="${kind}:${m.k}"
        value="${esc(val)}" placeholder="${esc(m.hint||m.unit||"")}" style="margin-top:8px">`;
  return `<div class="metric">
    <div class="mtop"><span class="mname">${esc(m.label)}</span>${chip}</div>${input}
  </div>`;
}

    ${m.whiteReference ? `<div class="banner ok">

             : v<75 ? ["Moderate","var(--warn)"] : ["High","var(--bad)"];

  + "separate. The pigment figure here is indicative, and Dr. Fatima's own grading takes precedence.";

  { when:m => m.pigmentUneven>=50, title:"Uneven pigment",

  { when:m => m.texture>=55, title:"Rough texture",
    options:"Microneedling · resurfacing peel · PRP", note:"" },
  { when:m => m.hydration>=55, title:"Looks dry",
    options:"Hydrafacial · barrier and hydration protocol",
    note:"Correct dryness before any active treatment." }

/* Directly observable vs AI-estimated. Kept apart everywhere, exactly as
   your specification requires. Scores are shown as QUALITY (higher = better),
   converted from the severity figures the engine produces. */
const DIAL_SPEC = [
  { k:"texture",       name:"Texture",      obs:true  },
  { k:"pores",         name:"Pores",        obs:true  },
  { k:"pigmentUneven", name:"Pigmentation", obs:true  },
  { k:"wrinkles",      name:"Wrinkles",     obs:true  },
  { k:"redness",       name:"Redness",      obs:true  },
  { k:"blemishes",     name:"Acne / Spots", obs:true  },
  { k:"oiliness",      name:"Oiliness",     obs:true  },
  { k:"hydration",     name:"Hydration",    obs:false },
  { k:"barrier",       name:"Skin Barrier", obs:false },
  { k:"elasticity",    name:"Elasticity",   obs:false }
];
const qualityOf = (ai,k) => {
  if(ai[k] == null) return null;
  return Math.max(0, Math.min(100, 100 - Number(ai[k])));
};
/* Bands matched to the reference report: 78+ Good, 65–77 Moderate, 50–64 Needs care. */
const QBAND = q => q>=78 ? ["Good","var(--ok)"] : q>=65 ? ["Moderate","var(--warn)"]
                 : q>=50 ? ["Needs care","var(--warn)"] : ["Priority","var(--bad)"];

function dialSVG(q,col,size){
  const C=2*Math.PI*26;
  return `<svg viewBox="0 0 64 64" style="width:${size}px;height:${size}px">
    <circle cx="32" cy="32" r="26" fill="none" stroke="#ECE4E8" stroke-width="6"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-q/100)).toFixed(1)}"
      transform="rotate(-90 32 32)"/>
    <text x="32" y="38" text-anchor="middle" font-size="19" font-family="var(--mono)" fill="#1A1A1A">${q}</text>
  </svg>`;
}

/* ===================================================================
   SKIN ANALYSIS — runs on this device, in this browser.
   No server, no upload to anyone, nothing leaves the phone.

   Pigment and blood absorb light differently across red, green and blue.
   That difference is already in an ordinary photo; it is just mixed
   together. These sums pull the two apart.

   Verified against synthetic skin across Fitzpatrick II–VI before use.
   =================================================================== */
const MEL=[0.4143,0.3570,0.8372], HEM=[0.2988,0.6838,0.6657];
const _dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const _sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const _mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const _norm=a=>_mul(a,1/Math.sqrt(_dot(a,a)));
const _E=_norm([1,1,1]);
const _deshade=v=>_sub(v,_mul(_E,_dot(v,_E)));
const _Mp=_deshade(MEL), _Hp=_deshade(HEM);
const _A11=_dot(_Mp,_Mp), _A12=_dot(_Mp,_Hp), _A22=_dot(_Hp,_Hp);
const _DET=_A11*_A22-_A12*_A12;

function unmix(r,g,b){
  const eps=1/255;
  const D=[-Math.log10(Math.max(r/255,eps)),
           -Math.log10(Math.max(g/255,eps)),
           -Math.log10(Math.max(b/255,eps))];
  const Dp=_deshade(D), b1=_dot(Dp,_Mp), b2=_dot(Dp,_Hp);
  return { mel:(_A22*b1-_A12*b2)/_DET, hem:(-_A12*b1+_A11*b2)/_DET };
}

/* Proportions of red/green/blue, not absolute colour — absolute chroma
   collapses on deep skin and throws away Fitzpatrick VI faces entirely. */
function isSkin(r,g,b){
  const sum=r+g+b;
  if(sum<48 || sum>700) return false;
  const rn=r/sum, gn=g/sum, bn=b/sum;
  if(rn<0.385||rn>0.545) return false;
  if(gn<0.275||gn>0.485) return false;
  if(bn>0.31) return false;
  if(r<g || g<b) return false;
  return true;
}

/* The sheet of white paper. Deliberately NOT tested for looking neutral —
   under a warm bulb the paper reads orange, and that cast is precisely the
   measurement we need. */
function findWhiteReference(px,n){
  let clipped=0; const cand=[], allLum=[];
  for(let i=0;i<n;i++){
    const r=px[i*4],g=px[i*4+1],b=px[i*4+2];
    allLum.push(0.299*r+0.587*g+0.114*b);
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    if(mx>=250){ clipped++; continue; }
    if(mx<90) continue;
    if(mx-mn > mx*0.45) continue;
    cand.push([r,g,b,0.299*r+0.587*g+0.114*b]);
  }
  if(clipped > n*0.02)      return { ref:null, clipped:true };
  if(cand.length < n*0.004) return { ref:null, clipped:false };
  cand.sort((p,q)=>q[3]-p[3]);
  const take=cand.slice(0, Math.max(1,Math.floor(cand.length*0.15)));
  const s=take.reduce((a,c)=>[a[0]+c[0],a[1]+c[1],a[2]+c[2]],[0,0,0]);
  const ref=[s[0]/take.length,s[1]/take.length,s[2]/take.length];
  allLum.sort((a,b)=>a-b);
  const mid=allLum[Math.floor(allLum.length/2)];
  if(0.299*ref[0]+0.587*ref[1]+0.114*ref[2] < mid*1.12) return { ref:null, clipped:false };
  return { ref, clipped:false };
}

function analysePixels(px,w,h,manualRef){
  const total=w*h;
  // If you tapped the chart yourself, that wins. Guessing is only a fallback.
  const wr = manualRef ? { ref:manualRef, clipped:false, manual:true }
                       : findWhiteReference(px,total);
  let gain=[1,1,1];
  if(wr.ref){
    const avg=(wr.ref[0]+wr.ref[1]+wr.ref[2])/3;
    gain=[avg/wr.ref[0], avg/wr.ref[1], avg/wr.ref[2]];
  }
  const mels=[],hems=[],lums=new Float32Array(total).fill(-1);
  let skin=0, dark=0, shine=0;
  const melMap=new Float32Array(total).fill(NaN), hemMap=new Float32Array(total).fill(NaN);
  const mask=new Uint8Array(total), shineMap=new Float32Array(total).fill(NaN);

  for(let i=0;i<total;i++){
    let r=px[i*4],g=px[i*4+1],b=px[i*4+2];
    if(!isSkin(r,g,b)) continue;
    skin++; mask[i]=1;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    shineMap[i]=mx/255;
    if(mx>248 && mx-mn<28){ shine++; continue; }
    r=Math.min(255,r*gain[0]); g=Math.min(255,g*gain[1]); b=Math.min(255,b*gain[2]);
    if(Math.min(r,g,b)<10) dark++;
    const o=unmix(r,g,b);
    mels.push(o.mel); hems.push(o.hem);
    melMap[i]=o.mel; hemMap[i]=o.hem;
    lums[i]=0.299*r+0.587*g+0.114*b;
  }
  if(mels.length < total*0.01)
    return { ok:false, reason:"No skin found. Check the face fills the frame and is lit well enough." };

  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length);};

  // texture: how much brightness varies between a pixel and its neighbour
  let tSum=0,tN=0;
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    const i=y*w+x; if(lums[i]<0) continue;
    const j=i+1, k=i+w;
    if(lums[j]<0||lums[k]<0) continue;
    tSum += Math.abs(lums[i]-lums[j]) + Math.abs(lums[i]-lums[k]); tN+=2;
  }
  const texture = tN ? tSum/tN : 0;
  // per-pixel roughness, for the texture panel
  const texMap=new Float32Array(total).fill(NaN);
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    const i=y*w+x; if(lums[i]<0) continue;
    let s=0,n=0;
    for(const j of [i-1,i+1,i-w,i+w]) if(lums[j]>=0){ s+=Math.abs(lums[i]-lums[j]); n++; }
    if(n) texMap[i]=s/n;
  }
  const spotRes = detectSpots(melMap, w, h, mask);

  // wrinkles (lines, wide spacing) and pores (dots, tight spacing)
  const ridgeW = ridgeResponse(lums, w, h, mask, 3);
  const ridgeP = ridgeResponse(lums, w, h, mask, 1);
  const wrinkles = connectedBlobs(ridgeW,w,h,mask,5,10,Math.round(w*h*0.02)).filter(isWrinkle);
  const pores    = connectedBlobs(ridgeP,w,h,mask,4,2,26).filter(isPore);
  const per1000 = n => n / Math.max(1, skin/1000);

  const sc=(v,lo,hi)=>Math.round(Math.max(0,Math.min(100,((v-lo)/(hi-lo))*100)));

  return {
    ok:true,
    whiteReference: !!wr.ref,
    whiteManual: !!wr.manual,
    whiteRefRGB: wr.ref ? wr.ref.map(x=>Math.round(x)) : null,
    whiteClipped: wr.clipped,
    skinPercent: Math.round(skin/total*100),
    lowConfidencePercent: Math.round(dark/Math.max(1,mels.length)*100),
    maps: { melMap, hemMap, texMap, shineMap, ridgeW, ridgeP, mask, w, h },
    spots: spotRes, wrinkles, pores,
    metrics: (function(){
      const m = {
        spotCount:     spotRes.count,
        spotAreaRatio: +(spotRes.areaPx/Math.max(1,spotRes.skinPx)*100).toFixed(2),
        wrinkleCount:  wrinkles.length,
        poreCount:     pores.length,
        pigment:       sc(mean(mels), 0.10, 1.60),
        pigmentUneven: sc(sd(mels),   0.00, 0.35),
        redness:       sc(mean(hems), 0.02, 0.70),
        rednessUneven: sc(sd(hems),   0.00, 0.25),
        oiliness:      Math.round(shine/Math.max(1,skin)*100),
        texture:       sc(texture, 0.5, 12),
        wrinkles:      sc(per1000(wrinkles.length), 0, 1.2),
        pores:         sc(per1000(pores.length),    0, 14),
        blemishes:     sc(per1000(spotRes.count),   0, 3.5)
      };
      // Appearance of dryness: fine roughness, minus the sheen of well-oiled skin.
      m.hydration = Math.max(0, Math.min(100, Math.round(m.texture - m.oiliness*0.5)));
      /* ---- AI ESTIMATES ----
         Inferred from visible-light features, never presented as measurements.
         Each is a stated formula so it can be checked and argued with. */
      // Barrier: inflammation plus a dry-looking surface.
      m.barrier    = Math.max(0, Math.min(100, Math.round(m.redness*0.55 + m.hydration*0.45)));
      // Elasticity: lines and roughness are what laxity looks like in a photograph.
      m.elasticity = Math.max(0, Math.min(100, Math.round(m.wrinkles*0.60 + m.texture*0.40)));
      /* Overall score. Deliberately a plain average of six measured things,
         each inverted so higher means better skin. No hidden weighting —
         if a patient asks how it was calculated, you can tell them. */
      const parts=[m.pigmentUneven, m.redness, m.texture, m.blemishes, m.wrinkles, m.pores];
      m.healthScore = Math.round(100 - parts.reduce((a,b)=>a+b,0)/parts.length);
      return m;
    })()
  };
}

/* ---- Comparing two areas of the SAME photo ----
   Both patches sit under identical light, so the difference between them
   survives even with no white reference at all. This is the most reliable
   measurement the app makes. */
const COMPARISONS = [
  { k:"darkCircle", label:"Dark circles",
    a:"Tap the darkest part under the eye", b:"Tap the cheek just below it",
    hint:"Tells you whether the darkness is pigment or blood — which decides the treatment." },
  { k:"sunDamage", label:"Sun-exposed vs covered skin",
    a:"Tap the cheek or forehead", b:"Tap under the jaw, or behind the ear",
    hint:"Sun-related pigment measured on this patient, not assumed from a database." },
  { k:"patch", label:"Patch vs normal skin",
    a:"Tap the middle of the patch", b:"Tap clear skin beside it",
    hint:"How distinct the patch is. This is the number that should fall with treatment." },
  { k:"custom", label:"Any two areas",
    a:"Tap the first area", b:"Tap the second area",
    hint:"Difference in pigment and redness between the two." }
];

/* Noise floors, measured rather than guessed: two patches of IDENTICAL skin,
   sampled the way this app samples, differ by up to these amounts 95% of the
   time from sensor noise and ordinary skin texture alone. Anything smaller is
   not a finding. Blood is measurable at a finer level than pigment, so the
   two get separate floors. */
const MEL_FLOOR = 0.068;
const HEM_FLOOR = 0.041;

function compareRegions(rgbA, rgbB){
  const A=unmix(rgbA[0],rgbA[1],rgbA[2]), B=unmix(rgbB[0],rgbB[1],rgbB[2]);
  const dMel=A.mel-B.mel, dHem=A.hem-B.hem;
  // How far above its own noise floor is each signal?
  const sMel=Math.abs(dMel)/MEL_FLOOR, sHem=Math.abs(dHem)/HEM_FLOOR;
  let verdict, detail;
  if(sMel<1 && sHem<1){
    verdict="No measurable difference";
    detail="The two areas read the same. Anything you can see between them is below what "
         + "a photograph can reliably measure — trust your eye, not this number.";
  } else if(sMel >= 2*sHem){
    verdict = dMel>0 ? "Mainly pigment" : "Mainly pigment — less in the first area";
    detail="Driven by melanin rather than blood. Pigment-directed treatment is the logical route.";
  } else if(sHem >= 2*sMel){
    verdict = dHem>0 ? "Mainly vascular" : "Mainly vascular — less in the first area";
    detail="Driven by blood rather than melanin. Brightening agents would be treating the wrong thing here.";
  } else {
    verdict="Mixed — pigment and vascular";
    detail="Both contribute meaningfully. Expect only a partial response to either approach alone.";
  }
  return { dMel:+dMel.toFixed(4), dHem:+dHem.toFixed(4),
           melScore:Math.round(Math.min(100,Math.abs(dMel)/1.5*100)),
           hemScore:Math.round(Math.min(100,Math.abs(dHem)/0.7*100)),
           confident: (sMel>=2 || sHem>=2),
           verdict, detail };
}

/* Median of a patch — resists a stray hair or a shadow line. */
function samplePatch(ctx,x,y,half){
  const x0=Math.max(0,x-half), y0=Math.max(0,y-half);
  const w=Math.max(1,Math.min(half*2, ctx.canvas.width-x0));
  const h=Math.max(1,Math.min(half*2, ctx.canvas.height-y0));
  const d=ctx.getImageData(x0,y0,w,h).data;
  const R=[],G=[],B=[];
  for(let i=0;i<d.length;i+=4){ R.push(d[i]); G.push(d[i+1]); B.push(d[i+2]); }
  const med=a=>{a.sort((p,q)=>p-q);return a[Math.floor(a.length/2)];};
  return [med(R),med(G),med(B)];
}

/* ---- Panels ----
   The face stays visible and findings are marked on top of it. A flat
   recoloured blob tells a patient nothing; a marked face tells them
   exactly where the problem is. */

/* Average of a masked map within a radius — the local "normal" level. */
function localBackground(map, w, h, mask, radius){
  const W1=w+1;
  const sum=new Float64Array(W1*(h+1)), cnt=new Float64Array(W1*(h+1));
  for(let y=0;y<h;y++){
    let rs=0, rc=0;
    for(let x=0;x<w;x++){
      const i=y*w+x;
      if(mask[i]){ rs+=map[i]; rc++; }
      sum[(y+1)*W1+x+1]=sum[y*W1+x+1]+rs;
      cnt[(y+1)*W1+x+1]=cnt[y*W1+x+1]+rc;
    }
  }
  const out=new Float32Array(w*h).fill(NaN);
  const at=(a,x,y)=>a[y*W1+x];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=y*w+x; if(!mask[i]) continue;
    const x0=Math.max(0,x-radius), y0=Math.max(0,y-radius);
    const x1=Math.min(w,x+radius+1), y1=Math.min(h,y+radius+1);
    const s=at(sum,x1,y1)-at(sum,x0,y1)-at(sum,x1,y0)+at(sum,x0,y0);
    const c=at(cnt,x1,y1)-at(cnt,x0,y1)-at(cnt,x1,y0)+at(cnt,x0,y0);
    out[i]= c>0 ? s/c : NaN;
  }
  return out;
}

/* Discrete, countable spots. Smoothed first: a real blemish spans several
   pixels and survives; single-pixel noise does not. Without this step,
   sensor noise on deep skin invents dozens of spots on a clear face. */
function detectSpots(rawMap, w, h, mask, opts={}){
  const map = localBackground(rawMap, w, h, mask, opts.smooth || 2);
  const radius = opts.radius || Math.max(8, Math.round(Math.min(w,h)*0.06));
  const bg = localBackground(map, w, h, mask, radius);
  const diffs=[];
  for(let i=0;i<w*h;i++) if(mask[i] && !isNaN(bg[i])) diffs.push(map[i]-bg[i]);
  if(!diffs.length) return { spots:[], count:0, areaPx:0, skinPx:0, bands:{mild:0,moderate:0,severe:0} };
  diffs.sort((a,b)=>a-b);
  const sd = Math.abs(diffs[Math.floor(diffs.length*0.84)] - diffs[Math.floor(diffs.length*0.50)]);
  const thr = Math.max(opts.floor || 0.030, sd*1.8);

  const hot=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++) if(mask[i] && !isNaN(bg[i]) && map[i]-bg[i] > thr) hot[i]=1;

  const seen=new Uint8Array(w*h), spots=[];
  const minA = opts.minArea || Math.max(8, Math.round(w*h*0.00010));
  const maxA = opts.maxArea || Math.round(w*h*0.02);
  const stack=new Int32Array(w*h);
  for(let s=0;s<w*h;s++){
    if(!hot[s]||seen[s]) continue;
    let sp=0; stack[sp++]=s; seen[s]=1;
    let n=0,sx=0,sy=0,peak=0;
    while(sp){
      const i=stack[--sp]; n++;
      const x=i%w, y=(i/w)|0; sx+=x; sy+=y;
      peak=Math.max(peak, map[i]-bg[i]);
      if(x>0   && hot[i-1] && !seen[i-1]){ seen[i-1]=1; stack[sp++]=i-1; }
      if(x<w-1 && hot[i+1] && !seen[i+1]){ seen[i+1]=1; stack[sp++]=i+1; }
      if(y>0   && hot[i-w] && !seen[i-w]){ seen[i-w]=1; stack[sp++]=i-w; }
      if(y<h-1 && hot[i+w] && !seen[i+w]){ seen[i+w]=1; stack[sp++]=i+w; }
    }
    if(n<minA||n>maxA) continue;
    spots.push({ x:Math.round(sx/n), y:Math.round(sy/n), area:n, peak:+peak.toFixed(4),
                 r:Math.max(3,Math.round(Math.sqrt(n/Math.PI)*1.6)) });
  }
  spots.sort((a,b)=>b.peak-a.peak);
  let skinPx=0; for(let i=0;i<w*h;i++) if(mask[i]) skinPx++;
  const bands={mild:0,moderate:0,severe:0};
  for(const s of spots){
    if(s.peak>thr*2.5) bands.severe++; else if(s.peak>thr*1.6) bands.moderate++; else bands.mild++;
  }
  return { spots, count:spots.length, areaPx:spots.reduce((a,s)=>a+s.area,0),
           skinPx, threshold:+thr.toFixed(4), bands };
}

/* Wrinkles are LINES, pores are DOTS. The same darkness detector finds both,
   so they are separated by shape — otherwise every pore becomes a wrinkle. */
function ridgeResponse(lum, w, h, mask, d){
  const out=new Float32Array(w*h).fill(NaN);
  const dirs=[[d,0],[0,d],[d,d],[d,-d]];
  for(let y=d;y<h-d;y++) for(let x=d;x<w-d;x++){
    const i=y*w+x; if(!mask[i]||lum[i]<0) continue;
    let best=-1e9;
    for(let k=0;k<4;k++){
      const dx=dirs[k][0], dy=dirs[k][1];
      const a=i+dy*w+dx, b=i-dy*w-dx;
      if(lum[a]<0||lum[b]<0) continue;
      const v=(lum[a]+lum[b])/2 - lum[i];   // darker than both sides = a valley
      if(v>best) best=v;
    }
    if(best>-1e8) out[i]=best;
  }
  return out;
}
function connectedBlobs(mapArr,w,h,mask,thr,minA,maxA){
  const hot=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++) if(mask[i]&&!isNaN(mapArr[i])&&mapArr[i]>thr) hot[i]=1;
  const seen=new Uint8Array(w*h), out=[], stack=new Int32Array(w*h);
  for(let s=0;s<w*h;s++){
    if(!hot[s]||seen[s]) continue;
    let sp=0; stack[sp++]=s; seen[s]=1;
    let n=0,minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9,sx=0,sy=0;
    while(sp){
      const i=stack[--sp]; n++;
      const x=i%w,y=(i/w)|0; sx+=x; sy+=y;
      if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
      if(x>0&&hot[i-1]&&!seen[i-1]){seen[i-1]=1;stack[sp++]=i-1;}
      if(x<w-1&&hot[i+1]&&!seen[i+1]){seen[i+1]=1;stack[sp++]=i+1;}
      if(y>0&&hot[i-w]&&!seen[i-w]){seen[i-w]=1;stack[sp++]=i-w;}
      if(y<h-1&&hot[i+w]&&!seen[i+w]){seen[i+w]=1;stack[sp++]=i+w;}
    }
    if(n<minA||n>maxA) continue;
    const bw=maxx-minx+1, bh=maxy-miny+1;
    out.push({x:Math.round(sx/n),y:Math.round(sy/n),area:n,
              elong:Math.max(bw,bh)/Math.max(1,Math.min(bw,bh)),len:Math.max(bw,bh)});
  }
  return out;
}
const isWrinkle = b => b.elong>=2.6 && b.len>=7;
const isPore    = b => b.elong<2.0 && b.area<=26;

const PANEL_STYLES = {
  brown:   { rgb:[150, 70, 10] },
  red:     { rgb:[210, 25, 35] },
  texture: { rgb:[0, 150, 165] },
  shine:   { rgb:[235, 175, 0] },
  wrinkle: { rgb:[105, 45, 175] },
  pore:    { rgb:[25, 90, 200]  }
};

/* Photo underneath, finding highlighted on top. */
function renderPanel(basePx, w, h, map, mask, styleKey, spots){
  const st=PANEL_STYLES[styleKey] || PANEL_STYLES.brown;
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d");
  const im=ctx.createImageData(w,h);

  let lo=0, hi=1;
  if(map){
    const bg=localBackground(map,w,h,mask,Math.max(8,Math.round(Math.min(w,h)*0.06)));
    const d=[];
    for(let i=0;i<w*h;i++) if(mask[i]&&!isNaN(bg[i])) d.push(map[i]-bg[i]);
    d.sort((a,b)=>a-b);
    lo=d[Math.floor(d.length*0.70)]; hi=d[Math.floor(d.length*0.995)];
    if(!(hi>lo)) hi=lo+1e-6;
    for(let i=0;i<w*h;i++){
      // desaturate the face slightly so the colour overlay reads clearly
      const r=basePx[i*4], g=basePx[i*4+1], b=basePx[i*4+2];
      const y=0.299*r+0.587*g+0.114*b;
      let R=r*0.55+y*0.45, G=g*0.55+y*0.45, B=b*0.55+y*0.45;
      R=R*0.82+255*0.18; G=G*0.82+255*0.18; B=B*0.82+255*0.18;
      if(mask[i] && !isNaN(bg[i])){
        const t=Math.max(0,Math.min(1,((map[i]-bg[i])-lo)/(hi-lo)));
        if(t>0){
          const a=Math.pow(t,0.75)*0.88;
          R=R*(1-a)+st.rgb[0]*a; G=G*(1-a)+st.rgb[1]*a; B=B*(1-a)+st.rgb[2]*a;
        }
      }
      im.data[i*4]=R; im.data[i*4+1]=G; im.data[i*4+2]=B; im.data[i*4+3]=255;
    }
  } else {
    for(let i=0;i<w*h;i++){
      const r=basePx[i*4],g=basePx[i*4+1],b=basePx[i*4+2];
      const y=0.299*r+0.587*g+0.114*b;
      im.data[i*4]=r*0.5+y*0.5; im.data[i*4+1]=g*0.5+y*0.5; im.data[i*4+2]=b*0.5+y*0.5;
      im.data[i*4+3]=255;
    }
  }
  ctx.putImageData(im,0,0);

  if(spots && spots.length){
    ctx.lineWidth=Math.max(1.2, Math.min(w,h)/420);
    for(const s of spots){
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle = s.peak>0.09 ? "rgba(255,60,40,.30)" : "rgba(60,220,90,.26)";
      ctx.fill();
      ctx.strokeStyle = s.peak>0.09 ? "rgba(255,60,40,.95)" : "rgba(40,220,80,.95)";
      ctx.stroke();
    }
  }
  return c.toDataURL("image/jpeg", 0.88);
}

/* Show the photo and let the clinician tap the chart. Removes all guessing
   about whether the app found the reference or a shiny forehead. */
function pickWhitePoint(signedUrl){
  return new Promise(resolve => {
    const ov=document.createElement("div");
    ov.style.cssText="position:fixed;inset:0;z-index:400;background:rgba(26,26,26,.93);"+
      "display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px";
    ov.innerHTML=`
      <p style="color:#fff;font-size:15px;text-align:center;max-width:340px;margin:0;line-height:1.5">
        Tap your white chart or paper in the photo.</p>
      <p style="color:#bbb;font-size:12.5px;text-align:center;max-width:340px;margin:0;line-height:1.5">
        Tap the chart itself — not the wall, not skin.</p>
      <img id="wpImg" style="max-width:100%;max-height:58vh;border-radius:8px;cursor:crosshair">
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button id="wpAuto" style="padding:12px 16px;border-radius:6px;border:1px solid #777;
          background:transparent;color:#eee;font-size:14px;min-height:46px">Find it automatically</button>
        <button id="wpNone" style="padding:12px 16px;border-radius:6px;border:1px solid #777;
          background:transparent;color:#eee;font-size:14px;min-height:46px">No chart in this photo</button>
      </div>`;
    document.body.appendChild(ov);
    const im=ov.querySelector("#wpImg");
    im.crossOrigin="anonymous"; im.src=signedUrl;
    const done=v=>{ ov.remove(); resolve(v); };
    im.onclick=e=>{
      const rect=im.getBoundingClientRect();
      const c=document.createElement("canvas");
      c.width=im.naturalWidth; c.height=im.naturalHeight;
      c.getContext("2d").drawImage(im,0,0);
      const x=Math.round((e.clientX-rect.left)/rect.width*c.width);
      const y=Math.round((e.clientY-rect.top)/rect.height*c.height);
      const s=9, x0=Math.max(0,x-s), y0=Math.max(0,y-s);
      const w=Math.min(s*2,c.width-x0), h=Math.min(s*2,c.height-y0);
      const d=c.getContext("2d").getImageData(x0,y0,w,h).data;
      let r=0,g=0,b=0,n=0;
      for(let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; }
      done({ mode:"manual", ref:[r/n,g/n,b/n] });
    };
    ov.querySelector("#wpAuto").onclick=()=>done({ mode:"auto" });
    ov.querySelector("#wpNone").onclick=()=>done({ mode:"none" });
  });
}

function pickTwoPoints(signedUrl){
  return new Promise(resolve => {
    const ov=document.createElement("div");
    ov.style.cssText="position:fixed;inset:0;z-index:400;background:rgba(26,26,26,.94);"+
      "display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:11px;overflow:auto";
    ov.innerHTML=`
      <div id="cpStep" style="color:#fff;font-size:15px;text-align:center;max-width:360px;line-height:1.5"></div>
      <div id="cpHint" style="color:#bbb;font-size:12.5px;text-align:center;max-width:360px;line-height:1.5"></div>
      <div id="cpPick" style="display:flex;flex-direction:column;gap:8px;width:100%;max-width:330px"></div>
      <div style="position:relative;max-width:100%">
        <img id="cpImg" style="max-width:100%;max-height:56vh;border-radius:8px;cursor:crosshair;display:none">
        <div id="cpDots"></div>
      </div>
      <button id="cpCancel" style="padding:12px 16px;border-radius:6px;border:1px solid #777;
        background:transparent;color:#eee;font-size:14px;min-height:46px">Cancel</button>`;
    document.body.appendChild(ov);
    const im=ov.querySelector("#cpImg"), step=ov.querySelector("#cpStep"),
          hint=ov.querySelector("#cpHint"), pick=ov.querySelector("#cpPick"),
          dots=ov.querySelector("#cpDots");
    im.crossOrigin="anonymous"; im.src=signedUrl;
    const done=v=>{ ov.remove(); resolve(v); };
    ov.querySelector("#cpCancel").onclick=()=>done(null);

    step.textContent="What would you like to compare?";
    pick.innerHTML=COMPARISONS.map(c=>
      `<button data-c="${c.k}" style="padding:13px;border-radius:6px;border:1px solid #777;
        background:transparent;color:#fff;font-size:14px;text-align:left;min-height:46px">
        ${c.label}<div style="color:#aaa;font-size:11.5px;margin-top:3px;line-height:1.4">${c.hint}</div></button>`).join("");

    pick.querySelectorAll("[data-c]").forEach(btn => btn.onclick = () => {
      const spec=COMPARISONS.find(c=>c.k===btn.dataset.c);
      pick.style.display="none"; im.style.display="block";
      let first=null;
      step.textContent=spec.a;
      hint.textContent="Tap in the middle of the area, away from hair and shadow.";
      im.onclick=e=>{
        const rect=im.getBoundingClientRect();
        const c=document.createElement("canvas");
        c.width=im.naturalWidth; c.height=im.naturalHeight;
        const ctx=c.getContext("2d"); ctx.drawImage(im,0,0);
        const x=Math.round((e.clientX-rect.left)/rect.width*c.width);
        const y=Math.round((e.clientY-rect.top)/rect.height*c.height);
        const half=Math.max(6, Math.round(Math.min(c.width,c.height)*0.02));
        const rgb=samplePatch(ctx,x,y,half);
        const dot=document.createElement("div");
        dot.style.cssText=`position:absolute;left:${e.clientX-rect.left-9}px;top:${e.clientY-rect.top-9}px;`+
          `width:18px;height:18px;border-radius:50%;border:2px solid #E5007D;`+
          `background:rgba(229,0,125,.28);pointer-events:none`;
        dots.appendChild(dot);
        if(!first){
          first=rgb;
          step.textContent=spec.b;
          hint.textContent="Now the comparison area.";
        } else {
          done({ kind:spec.k, label:spec.label, a:first, b:rgb });
        }
      };
    });
  });
}

async function runCompare(reportId, pickResult){
  const res = compareRegions(pickResult.a, pickResult.b);
  const { data:rep } = await sb.from("di_reports").select("ai").eq("id", reportId).single();
  const ai = Object.assign({}, rep.ai||{});
  const list = (ai._compare||[]).filter(c => c.kind !== pickResult.kind);
  list.push(Object.assign({ kind:pickResult.kind, label:pickResult.label,
              rgbA:pickResult.a.map(Math.round), rgbB:pickResult.b.map(Math.round),
              at:new Date().toISOString() }, res));
  ai._compare = list;
  await sb.from("di_reports").update({ ai, updated_at:new Date().toISOString() }).eq("id", reportId);
  await addAudit(reportId, "Compared two areas: " + pickResult.label + " — " + res.verdict);
  return res;
}

async function runAnalysis(reportId, signedUrl, choice){
  const img = new Image();
  img.crossOrigin = "anonymous";
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=()=>rej(new Error("could not read that photo")); img.src=signedUrl; });
  const maxW=700, sc=Math.min(1, maxW/img.width);
  const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  const px=c.getContext("2d").getImageData(0,0,w,h).data;

  const r = (choice && choice.mode==="manual") ? analysePixels(px,w,h,choice.ref)
          : (choice && choice.mode==="none")   ? analysePixels(px,w,h,[1,1,1])
          :                                      analysePixels(px,w,h);
  if(choice && choice.mode==="none" && r.ok){ r.whiteReference=false; r.whiteRefRGB=null; }
  if(!r.ok) throw new Error(r.reason);

  // Build the panels the patient actually looks at.
  if(r.maps){
    const M=r.maps;
    const { data:rr } = await sb.from("di_reports").select("patient_id").eq("id", reportId).single();
    const panels = [
      ["spots",   renderPanel(px,w,h,null,       M.mask, "brown",   r.spots.spots)],
      ["brown",   renderPanel(px,w,h,M.melMap,   M.mask, "brown",   null)],
      ["red",     renderPanel(px,w,h,M.hemMap,   M.mask, "red",     null)],
      ["wrinkle", renderPanel(px,w,h,M.ridgeW,   M.mask, "wrinkle", null)],
      ["pore",    renderPanel(px,w,h,M.ridgeP,   M.mask, "pore",    null)],
      ["texture", renderPanel(px,w,h,M.texMap,   M.mask, "texture", null)],
      ["shine",   renderPanel(px,w,h,M.shineMap, M.mask, "shine",   null)]
    ];
    for(const [kind,url] of panels){
      if(!url) continue;
      const blob = await (await fetch(url)).blob();
      const path = `${rr.patient_id}/${reportId}/panel-${kind}.jpg`;
      await sb.storage.from(BUCKET).upload(path, blob, { contentType:"image/jpeg", upsert:true });
      const label = "map:"+kind;
      const { data:existing } = await sb.from("di_photos").select("id")
        .eq("report_id", reportId).eq("view_label", label);
      if(!existing || !existing.length)
        await sb.from("di_photos").insert({ report_id:reportId, patient_id:rr.patient_id,
          storage_path:path, view_label:label });
    }
  }

  const { data:rep } = await sb.from("di_reports").select("ai").eq("id", reportId).single();
  const ai = Object.assign({}, rep.ai||{}, r.metrics, {
    _meta:{ whiteReference:r.whiteReference, whiteClipped:r.whiteClipped,
            whiteManual:r.whiteManual, whiteRefRGB:r.whiteRefRGB,
            skinPercent:r.skinPercent, lowConfidencePercent:r.lowConfidencePercent,
            spotBands:r.spots?r.spots.bands:null,
            at:new Date().toISOString() }
  });
  await sb.from("di_reports").update({ ai, engine:"in-app photo analysis",
    updated_at:new Date().toISOString() }).eq("id", reportId);
  await addAudit(reportId, "Photo analysed in app");
  return r;
}

/* ===================================================================
   BUTTON WIRING
   =================================================================== */
async function wireUp(){
  const q = $("#q");
  if(q) q.oninput = e => {
    searchQ = e.target.value.trim();
    clearTimeout(q._t); q._t = setTimeout(render, 300);
  };

  // photos are private — fetch a temporary signed link for each
  for(const img of $$("img[data-path]")){
    const { data } = await sb.storage.from(BUCKET).createSignedUrl(img.dataset.path, 3600);
    if(data && data.signedUrl) img.src = data.signedUrl;
  }

  const sp = $("#savePatient");
  if(sp) sp.onclick = async () => {
    const row = {};
    $$("[data-f]").forEach(el => {
      const k = el.dataset.f, v = el.value.trim();
      row[k] = NUMERIC.includes(k) ? num(v) : (v || null);
    });
    if(!row.name){ toast("Please enter a name."); return; }
    row.consent = {};
    $$("[data-c]").forEach(el => row.consent[el.dataset.c] = el.checked);
    row.updated_at = new Date().toISOString();
    sp.disabled = true;
    try {
      let id = sp.dataset.id;
      if(id){
        const { error } = await sb.from("di_patients").update(row).eq("id", id);
        if(error) throw error;
      } else {
        const { data, error } = await sb.from("di_patients").insert(row).select("id").single();
        if(error) throw error;
        id = data.id;
      }
      toast("Saved.");
      go("patient", { id });
    } catch(e){ fail(e); sp.disabled = false; }
  };

  const dp = $("#delPatient");
  if(dp) dp.onclick = async () => {
    if(!confirm("Delete this patient, and every report and photo belonging to them?\n\nThis cannot be undone.")) return;
    try {
      const { data:phs } = await sb.from("di_photos").select("storage_path").eq("patient_id", dp.dataset.id);
      if(phs && phs.length) await sb.storage.from(BUCKET).remove(phs.map(x => x.storage_path));
      const { error } = await sb.from("di_patients").delete().eq("id", dp.dataset.id);
      if(error) throw error;
      toast("Deleted."); go("patients");
    } catch(e){ fail(e); }
  };

  const pi = $("#photoIn");
  if(pi) pi.onchange = async e => {
    const files = Array.from(e.target.files); if(!files.length) return;
    toast("Uploading…", 9000);
    try {
      const { data:r } = await sb.from("di_reports").select("id,patient_id").eq("id", CTX.id).single();
      for(const f of files){
        const blob = await shrink(f);
        const path = `${r.patient_id}/${r.id}/${crypto.randomUUID()}.jpg`;
        const { error:upErr } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:"image/jpeg" });
        if(upErr) throw upErr;
        const { error:rowErr } = await sb.from("di_photos")
          .insert({ report_id:r.id, patient_id:r.patient_id, storage_path:path });
        if(rowErr) throw rowErr;
      }
      await addAudit(CTX.id, files.length + " photo(s) added");
      toast("Photos saved."); render();
    } catch(err){ fail(err); }
  };

  $$("[data-delphoto]").forEach(b => b.onclick = async () => {
    if(!confirm("Remove this photo?")) return;
    try {
      await sb.storage.from(BUCKET).remove([b.dataset.path]);
      await sb.from("di_photos").delete().eq("id", b.dataset.delphoto);
      await addAudit(CTX.id, "Photo removed");
      render();
    } catch(e){ fail(e); }
  });

  $$("[data-analyse]").forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = "Analysing…";
    try {
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(b.dataset.analyse, 600);
      if(error) throw error;
      const choice = await pickWhitePoint(data.signedUrl);
      const res = await runAnalysis(CTX.id, data.signedUrl, choice);
      const found = res.whiteReference
        ? (res.whiteManual ? "White point set from your tap." : "White reference found automatically.")
        : "No white reference used.";
      toast("Analysed. " + found + " " + res.spots.count + " spots, "
            + res.wrinkles.length + " lines, " + res.pores.length + " pores.", 5000);
      render();
    } catch(e){ fail(e); b.disabled=false; b.textContent="Analyse"; }
  });

  $$("[data-compare]").forEach(b => b.onclick = async () => {
    try {
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(b.dataset.compare, 600);
      if(error) throw error;
      const picked = await pickTwoPoints(data.signedUrl);
      if(!picked) return;
      const res = await runCompare(CTX.id, picked);
      toast(picked.label + ": " + res.verdict, 4500);
      render();
    } catch(e){ fail(e); }
  });

  const aj = $("#applyJson");
  if(aj) aj.onclick = async () => {
    const raw = $("#pasteJson").value.trim();
    if(!raw){ toast("Paste the engine's result first."); return; }
    let obj;
    try { obj = JSON.parse(raw); }
    catch(e){ toast("That is not a valid result. Copy the whole thing including the curly brackets."); return; }
    const s = obj.scores || obj, aiNew = {};
    let n = 0;
    SKIN_AI.forEach(m => {
      let v = s[m.k]; if(v == null) return;
      v = Number(v); if(!isFinite(v)) return;
      aiNew[m.k] = Math.round(v <= 1 ? v * 100 : v); n++;
    });
    if(!n){ toast("No matching measurements found in that text."); return; }
    try {
      await sb.from("di_reports").update({ ai:aiNew, engine:"skin-scan (pasted)",
        updated_at:new Date().toISOString() }).eq("id", CTX.id);
      await addAudit(CTX.id, n + " AI measurements imported");
      toast(n + " measurements locked in."); render();
    } catch(e){ fail(e); }
  };

  const ma = $("#manualAi");
  if(ma) ma.onclick = async () => {
    const { data:r } = await sb.from("di_reports").select("ai").eq("id", CTX.id).single();
    const aiNew = Object.assign({}, r.ai || {});
    for(const m of SKIN_AI){
      const v = prompt(m.label + " (0–100). Leave blank to skip.", aiNew[m.k] ?? "");
      if(v === null) break;
      if(v.trim() === "") continue;
      const n = Number(v); if(isFinite(n)) aiNew[m.k] = Math.round(n);
    }
    try {
      await sb.from("di_reports").update({ ai:aiNew, engine:"entered by clinician",
        updated_at:new Date().toISOString() }).eq("id", CTX.id);
      await addAudit(CTX.id, "Measurements entered manually");
      render();
    } catch(e){ fail(e); }
  };

  // editable fields save when you move away from them
  $$("[data-m]").forEach(el => el.onchange = async () => {
    const parts = el.dataset.m.split(":"), kind = parts[0], key = parts[1];
    try {
      const { data:r } = await sb.from("di_reports").select("grades,hair,hair_grades").eq("id", CTX.id).single();
      const patch = { updated_at:new Date().toISOString() };
      if(kind === "note")          patch.note        = el.value;
      else if(kind === "you")      patch.grades      = Object.assign({}, r.grades||{},      { [key]: el.value });
      else if(kind === "meas")     patch.hair        = Object.assign({}, r.hair||{},        { [key]: el.value });
      else if(kind === "hairYou")  patch.hair_grades = Object.assign({}, r.hair_grades||{}, { [key]: el.value });
      const { error } = await sb.from("di_reports").update(patch).eq("id", CTX.id);
      if(error) throw error;
      await addAudit(CTX.id, "Edited " + key);
    } catch(e){ fail(e); }
  });

  $$("[data-trust]").forEach(b => b.onclick = async () => {
    try {
      await sb.from("di_reports").update({ trust:b.dataset.trust,
        updated_at:new Date().toISOString() }).eq("id", CTX.id);
      await addAudit(CTX.id, "Trust set to " + b.dataset.trust);
      render();
    } catch(e){ fail(e); }
  });

  const so = $("#signOff");
  if(so) so.onclick = async () => {
    if(!confirm("Sign off this report?\n\nIt will be locked and cannot be edited afterwards.")) return;
    try {
      const { error } = await sb.from("di_reports").update({ signed:true,
        signed_at:new Date().toISOString(), updated_at:new Date().toISOString() }).eq("id", so.dataset.id);
      if(error) throw error;
      await addAudit(so.dataset.id, "Signed off by clinician");
      toast("Signed off and locked."); render();
    } catch(e){ fail(e); }
  };

  const dr = $("#delReport");
  if(dr) dr.onclick = async () => {
    if(!confirm("Delete this draft report and its photos?\n\nThis cannot be undone.")) return;
    try {
      const { data:phs } = await sb.from("di_photos").select("storage_path").eq("report_id", dr.dataset.id);
      if(phs && phs.length) await sb.storage.from(BUCKET).remove(phs.map(x => x.storage_path));
      await sb.from("di_reports").delete().eq("id", dr.dataset.id);
      toast("Draft deleted."); go("patient", { id: dr.dataset.pid });
    } catch(e){ fail(e); }
  };

  const ph = $("#printHandout");
  if(ph) ph.onclick = () => window.print();

  const ex = $("#exportAll");
  if(ex) ex.onclick = async () => {
    try {
      const { data:pats } = await sb.from("di_patients").select("*");
      const { data:reps } = await sb.from("di_reports").select("*");
      const blob = new Blob([JSON.stringify({ exported:new Date().toISOString(),
        patients:pats, reports:reps }, null, 2)], { type:"application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "auraa-derma-" + today() + ".json";
      a.click();
      toast("Downloaded. Keep it private.");
    } catch(e){ fail(e); }
  };
}

async function addAudit(reportId, what){
  const { data:r } = await sb.from("di_reports").select("audit").eq("id", reportId).single();
  const audit = ((r && r.audit) || []).concat([{ at:new Date().toISOString(), what }]);
  await sb.from("di_reports").update({ audit }).eq("id", reportId);
}

/* shrink the photo in the browser before uploading — keeps it around 150 KB */
function shrink(file, max=1600, q=0.85){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("could not read that image")), "image/jpeg", q);
    };
    img.onerror = () => rej(new Error("could not read that image"));
    img.src = URL.createObjectURL(file);
  });
}

/* one handler for every navigation button */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-open],[data-edit],[data-tab],[data-report],[data-newreport],[data-handout]");
  if(!t) return;
  if(t.dataset.open)         go("patient", { id:t.dataset.open });
  else if(t.dataset.edit)    go("edit",    { id:t.dataset.edit });
  else if(t.dataset.tab)     go(t.dataset.tab);
  else if(t.dataset.handout) go("handout", { id:t.dataset.handout });
  else if(t.dataset.report)  go("report",  { id:t.dataset.report });
  else if(t.dataset.newreport){
    try {
      const { data, error } = await sb.from("di_reports")
        .insert({ patient_id:t.dataset.newreport,
                  audit:[{ at:new Date().toISOString(), what:"Report created" }] })
        .select("id").single();
      if(error) throw error;
      go("report", { id:data.id });
    } catch(err){ fail(err); }
  }
});
